selection_rationale:
  - It is the undisturbed baseline for a repeatedly surveyed real Red Sea outcrop.
  - It has substantial three-dimensional relief and visible coral morphology.
  - It includes a high-resolution texture and per-corner UV coordinates.
  - Its meter-scale extent is appropriate for close AUV inspection and sensor tests.

known_limitations:
  - The record does not publish a survey-grade coordinate or vertical datum.
  - Water and lighting are baked into the source texture.
  - Photogrammetric occlusions and reconstruction artifacts remain possible.
  - Decimated visual derivatives must not replace the source mesh in scientific analysis.
