schema_version: 1
id: redsea.platform-calibration.v1
title: Red Sea Digital Twin platform calibration
stage: stage.usda
checksums: checksums.sha256
purpose: runtime_and_coordinate_smoke_test

truth_class: scenario
site:
  kind: synthetic_calibration
  wgs84_anchor: null
  georeferenced: false

frame:
  name: site_enu
  convention: east_north_up
  up_axis: Z
  meters_per_unit: 1.0
  water_surface_z_m: 0.0
  nominal_seabed_z_m: -5.0

runtime:
  canonical_manifest: ../../platform/runtime.yaml
  isaac_sim: "6.0.1"

acceptance:
  - stage loads without external assets or simulator extensions
  - default prim is RedSeaTwin
  - metersPerUnit is 1 and upAxis is Z
  - strict usdchecker validation passes
  - overview camera, lights, surface, seabed, axes, and scale references exist
  - the same committed stage is visible through the macOS WebRTC client
