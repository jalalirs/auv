server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The console addresses screens by path and has no server-side routing, so
    # anything that is not a file is the application itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API on the same origin, so the session cookie is sent and no token is
    # exposed to script.
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://control-plane:8080;
    }
}
