[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocean-mcp"
version = "0.1.0"
description = "iocean over MCP: places, vehicles and dives an agent can drive, with every number marked."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
iocean-mcp = "iocean_mcp.server:main"

[tool.setuptools]
packages = ["iocean_mcp"]
