[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocean"
version = "0.1.0"
description = "Write a controller for an iocean vehicle, run it in a tank or a dive, and deploy it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The headless tank runs the runtime's own physics, without Isaac Sim.
tank = ["iocean-runtime"]
dev = ["pytest"]

[project.scripts]
iocean = "iocean.cli:main"
# The old command, for scripts that call it.
coral-city = "iocean.cli:main"

[tool.setuptools]
packages = ["iocean", "iocean.vehicles", "coral_city"]
