            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [compute]
      summary: Place a device in a queue
      description: >
        Idempotent on the device's UUID, because an agent re-registers what it
        found every time it starts and a restarted host must not appear to have
        doubled its own capacity.
      parameters:
        - name: queueId
          in: path
          required: true
          description: The queue.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId, uuid, memoryBytes]
              properties:
                targetId: { type: string }
                deviceIndex: { type: integer, minimum: 0 }
                uuid: { type: string }
                model: { type: string }
                memoryBytes: { type: integer, format: int64 }
      responses:
        '201':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/queues/{queueId}/grants:
