openapi: 3.1.0

info:
  title: Coral City platform API
  version: "1.0.0"
  summary: A hub for oceanic engineering and science.
  description: |
    Coral City holds one shared, governed record of the ocean, lets people enter
    specific places at survey fidelity, merges live observation with simulation,
    and lets any institution run its own work against that world.

    Three rules run through everything here.

    **Access is decided in one place.** Every read and every write, including
    every request to run work, resolves through a single decision point. There
    are two ways of being refused: a hidden refusal reports absence, because the
    existence of some places is itself sensitive, and a visible refusal reports
    that the object exists and access may be requested. Both are recorded.

    **Evidence is never rewritten.** A published version is immutable.
    Corrections create new versions that supersede the old; retraction withdraws
    a version from default views without deleting it or its lineage. Every
    version states its coordinate reference, vertical datum, time basis, rights,
    and uncertainty — of which "unknown" is a legal answer and absence is not.

    **A truth class does not strengthen.** Anything derived from a scenario is a
    scenario, permanently, and the platform refuses to record otherwise.

servers:
  - url: /
    description: The deployment serving this document.

security:
  - session: []
  - service: []

tags:
  - name: health
    description: Whether the process is running and whether the platform can work.
  - name: sessions
    description: Signing in, signing out, and knowing who one is.
  - name: institutions
    description: Organisations, people, and the non-human principals they operate.
  - name: governance
    description: Bindings and grants. Who may do what, and where.
  - name: places
    description: Cities — bounded, curated, navigable regions.
  - name: layers
    description: The named series of versions within a scope.
  - name: evidence
    description: Versions, their manifests, their lineage, and their publication.
  - name: bytes
    description: Placing bytes in storage and checking that they are what was claimed.
  - name: work
    description: Submitting work and reading what became of it.
  - name: capacity
    description: Quotas and the places work can run.
  - name: worker
    description: The worker's half of the lease protocol.

paths:
  /health/live:
    get:
      tags: [health]
      summary: Report that the process can serve HTTP
      description: >
        Depends on nothing else, so that an outage elsewhere does not cause this process to be restarted when restarting it would not help.
      security: []
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /health/ready:
    get:
      tags: [health]
      summary: Report that the platform can do its work
      description: >
        The record is reachable, the schema is the one this build expects, and stored
        bytes can be reached. A build whose migrations have not been applied is
        deliberately not ready.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  checks: { type: object, additionalProperties: true }
        '503':
          description: Not ready. The body says which check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  checks: { type: object, additionalProperties: true }
  /api/v1/platform:
    get:
      tags: [health]
      summary: Identify the build serving this request
      security: []
      responses:
        '200':
          description: The build.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  service: { type: string }
                  version: { type: string }
                  commit: { type: string }
                  builtAt: { type: string }
  /api/v1/sessions:
    post:
      tags: [sessions]
      summary: Sign in
      description: >
        An unknown address and a wrong secret are refused identically, so the
        response cannot be used to discover who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, secret]
              properties:
                email: { type: string, format: email }
                secret: { type: string, minLength: 12 }
      responses:
        '201':
          description: A session, in a cookie the browser cannot read from script and in the body for programmatic clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  principal:
                    $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [sessions]
      summary: Sign out
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/me:
    get:
      tags: [sessions]
      summary: Report who the caller is
      responses:
        '200':
          description: The caller and the institutions whose bindings apply to them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: '#/components/schemas/Principal'
                  organisations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/me/denials:
    get:
      tags: [sessions]
      summary: Report the refusals the caller has received
      description: >
        Why access was denied is data, not a log line.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Recent refusals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  denials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Denial'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/organisations:
    get:
      tags: [identity]
      summary: Every institution on this installation
      responses:
        '200':
          description: The institutions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [institutions]
      summary: Found an institution
      description: >
        It is created holding contributor at its own scope, so that its members can
        do its work without a separate grant each.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
      responses:
        '201':
          description: The institution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/people:
    get:
      tags: [identity]
      summary: Everyone who can act
      description: >
        Disabled principals are listed and say so. The audit record names who
        did each thing, so a name that once acted remains a name.
      responses:
        '200':
          description: The people.
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      $ref: '#/components/schemas/Principal'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [institutions]
      summary: Add someone who can sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, email, secret]
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                secret: { type: string, minLength: 12 }
      responses:
        '201':
          description: The person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/grants:
    post:
      tags: [governance]
      summary: Bind a role at the platform, an institution, or the work queue
      description: >
        Grants on a city are made by that city's stewards instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectKind, subjectId, scopeKind, role]
              properties:
                subjectKind: { type: string, enum: [principal, org] }
                subjectId: { type: string }
                scopeKind: { type: string, enum: [platform, org, city, work] }
                scopeId: { type: string }
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}:
    get:
      tags: [institutions]
      summary: Read an institution and its members
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The institution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation:
                    $ref: '#/components/schemas/Organisation'
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Principal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/members:
    post:
      tags: [institutions]
      summary: Add a member
      description: >
        Membership makes the institution's bindings apply to that person; it grants nothing itself.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principalId]
              properties:
                principalId: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/members/{principalId}:
    delete:
      tags: [institutions]
      summary: Remove a member
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
        - name: principalId
          in: path
          required: true
          description: The person.
          schema: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/service-principals:
    post:
      tags: [institutions]
      summary: Add a worker, edge station, or vehicle
      description: >
        The credential is shown once and is not recoverable; it can only be replaced.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        '201':
          description: The principal and its credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: '#/components/schemas/Principal'
                  credential: { type: string }
                  notice: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/quota:
    put:
      tags: [capacity]
      summary: State what an institution may consume
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxConcurrentJobs, maxCpu, maxMemoryBytes]
              properties:
                maxConcurrentJobs: { type: integer, minimum: 0 }
                maxCpu: { type: number, minimum: 0 }
                maxMemoryBytes: { type: integer, format: int64, minimum: 0 }
                maxGpu: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [capacity]
      summary: Report what an institution may consume and what it does
      description: >
        Reading this before submitting is how a refusal becomes understandable in advance.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The quota and what is in flight.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    $ref: '#/components/schemas/Quota'
                  inUse: { type: object, additionalProperties: true }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/targets:
    post:
      tags: [capacity]
      summary: Record a place work can run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, capacityCpu, capacityMemoryBytes]
              properties:
                name: { type: string }
                kind: { type: string, enum: [local_docker, kubernetes, slurm] }
                capacityCpu: { type: number }
                capacityMemoryBytes: { type: integer, format: int64 }
                capacityGpu: { type: integer }
      responses:
        '201':
          description: The target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [capacity]
      summary: List the places work can run
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Target'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}/autonomy:
    get:
      tags: [dives]
      summary: An institution's autonomy
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The autonomy stacks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  autonomy:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutonomyStack'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [dives]
      summary: Register autonomy
      description: >
        The one thing here that is not the platform's. Pinned by image digest
        and never by tag, because a dive re-run against a tag that has moved is
        measuring a different program and reporting it as the same one.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name, imageRepository, imageDigest]
              properties:
                slug: { type: string }
                name: { type: string }
                imageRepository: { type: string }
                imageDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                subscribes:
                  type: array
                  items: { type: string }
                  description: The topics it expects to receive.
                publishes:
                  type: array
                  items: { type: string }
                  description: The topics it will send.
                wantsGpu:
                  type: boolean
                  description: >
                    Inference needs a device too, and on a single-GPU host it
                    shares one with the simulator.
      responses:
        '201':
          description: The autonomy stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomyStack'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}/conditions:
    post:
      tags: [dives]
      summary: Record the water a dive happens in
      description: >
        Observed conditions name the instant the ocean state is drawn from;
        constructed conditions must not, because that would claim a provenance
        they do not have. The difference between water that was measured and
        water that was invented is the platform's most important claim about a
        result.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, name]
              properties:
                kind: { type: string, enum: [observed, constructed] }
                name: { type: string }
                observedAt: { type: string, format: date-time }
                sources:
                  type: array
                  items: { type: object }
                  description: >
                    Where the ocean state came from, with the digest of each, so
                    that the same water can be assembled again.
                parameters: { type: object }
      responses:
        '201':
          description: The conditions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conditions'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}/dives:
    get:
      tags: [dives]
      summary: An institution's dives
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The dives.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dive'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [dives]
      summary: Define a dive
      description: >
        A vehicle in a place, under conditions, flown by autonomy. It names
        versions rather than assets, so that publishing a newer vehicle does not
        silently turn somebody's experiment into a different one.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, cityVersionId, vehicleVersionId, conditionsId]
              properties:
                name: { type: string }
                summary: { type: string }
                cityVersionId: { type: string }
                vehicleVersionId: { type: string }
                conditionsId: { type: string }
                autonomyStackId: { type: string }
                initialState: { type: object }
                objective: { type: object }
      responses:
        '201':
          description: The dive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dive'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dives/{diveId}:
    get:
      tags: [dives]
      summary: A dive
      parameters:
        - name: diveId
          in: path
          required: true
          description: The dive.
          schema: { type: string }
      responses:
        '200':
          description: The dive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dive'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/dives/{diveId}/runs:
    get:
      tags: [dives]
      summary: What a dive's executions did
      parameters:
        - name: diveId
          in: path
          required: true
          description: The dive.
          schema: { type: string }
      responses:
        '200':
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [dives]
      summary: Ask for a dive to be executed
      description: >
        Every determinant is copied from the dive as the run is admitted, so
        that editing the dive afterwards cannot change what a recorded result
        means. Supplying a seed asks for an earlier run again, exactly; leaving
        it out draws one.
      parameters:
        - name: diveId
          in: path
          required: true
          description: The dive.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [queueId, mode, runtimeVersion]
              properties:
                queueId: { type: string }
                mode:
                  type: string
                  enum: [interactive, batch]
                  description: >
                    Interactive holds a device, a stream and somebody's
                    attention; batch holds only a device.
                seed: { type: integer, format: int64 }
                runtimeVersion:
                  type: string
                  description: >
                    Recorded because a physics fix changes results, so comparing
                    across one has to be refused rather than done quietly.
                gpuShare:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 1
      responses:
        '202':
          description: The run, admitted and waiting for a device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/runs/claim:
    post:
      tags: [work]
      summary: Take the next dive this host can run
      description: >
        Answers 204 when there is nothing to do, which is the ordinary case: an
        agent asks constantly and mostly there is no work. The device is chosen
        and locked in the same statement that admits the run, so two agents
        asking at the same moment cannot both be told yes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId]
              properties:
                targetId: { type: string }
      responses:
        '200':
          description: The dive, and everything needed to compose it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedRun'
        '204':
          description: Nothing to run.
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/runs/{runId}/started:
    post:
      tags: [work]
      summary: The simulator is up
      parameters:
        - name: runId
          in: path
          required: true
          description: The run.
          schema: { type: string }
      responses:
        '204':
          description: Recorded.
        '400':
          $ref: '#/components/responses/Invalid'
  /api/v1/runs/{runId}/renew:
    post:
      tags: [work]
      summary: Still working; hold the device a while longer
      description: >
        An agent that stops saying this loses the device. It is the only way to
        tell an agent that is slow from one that is gone: a lease is the
        statement "I will say something again by this time", and its absence is
        the only evidence there is.
      parameters:
        - name: runId
          in: path
          required: true
          description: The run.
          schema: { type: string }
      responses:
        '200':
          description: The lease, extended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaseSeconds: { type: integer }
        '400':
          $ref: '#/components/responses/Invalid'
  /api/v1/runs/{runId}/events:
    post:
      tags: [work]
      summary: What happened during a run
      parameters:
        - name: runId
          in: path
          required: true
          description: The run.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string }
                simulatedSeconds:
                  type: number
                  description: >
                    Where in the dive this happened, which is what makes two
                    runs of the same seed comparable moment by moment.
                detail: { type: object }
      responses:
        '204':
          description: Appended.
        '400':
          $ref: '#/components/responses/Invalid'
  /api/v1/runs/{runId}/finished:
    post:
      tags: [work]
      summary: How a run ended
      description: >
        The last thing anything says about it: the record refuses to rewrite a
        finished run.
      parameters:
        - name: runId
          in: path
          required: true
          description: The run.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [succeeded, failed, cancelled] }
                outcome: { type: object }
                failureReason:
                  type: string
                  description: >
                    Required when the state is failed, and refused otherwise: a
                    failed run says why, and a run that says why has failed.
      responses:
        '204':
          description: Ended.
        '400':
          $ref: '#/components/responses/Invalid'
  /api/v1/queues:
    get:
      tags: [compute]
      summary: The queues the caller may submit to
      description: >
        Hardware carries no discoverability: a queue nobody granted you is absent, and so is one that does not exist.
      responses:
        '200':
          description: The queues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [compute]
      summary: Open a queue
      requestBody:
        required: true
