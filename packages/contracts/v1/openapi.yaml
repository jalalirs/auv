openapi: 3.1.0

info:
  title: Coral City platform API
  version: "1.0.0"
  summary: A hub for oceanic engineering and science.
  description: |
    Coral City holds one shared, governed record of the ocean, lets people enter
    specific places at survey fidelity, merges live observation with simulation,
    and lets any institution run its own work against that world.

    Three rules run through everything here.

    **Access is decided in one place.** Every read and every write, including
    every request to run work, resolves through a single decision point. There
    are two ways of being refused: a hidden refusal reports absence, because the
    existence of some places is itself sensitive, and a visible refusal reports
    that the object exists and access may be requested. Both are recorded.

    **Evidence is never rewritten.** A published version is immutable.
    Corrections create new versions that supersede the old; retraction withdraws
    a version from default views without deleting it or its lineage. Every
    version states its coordinate reference, vertical datum, time basis, rights,
    and uncertainty — of which "unknown" is a legal answer and absence is not.

    **A truth class does not strengthen.** Anything derived from a scenario is a
    scenario, permanently, and the platform refuses to record otherwise.

servers:
  - url: /
    description: The deployment serving this document.

security:
  - session: []
  - service: []

tags:
  - name: health
    description: Whether the process is running and whether the platform can work.
  - name: sessions
    description: Signing in, signing out, and knowing who one is.
  - name: institutions
    description: Organisations, people, and the non-human principals they operate.
  - name: governance
    description: Bindings and grants. Who may do what, and where.
  - name: places
    description: Cities — bounded, curated, navigable regions.
  - name: layers
    description: The named series of versions within a scope.
  - name: evidence
    description: Versions, their manifests, their lineage, and their publication.
  - name: bytes
    description: Placing bytes in storage and checking that they are what was claimed.
  - name: work
    description: Submitting work and reading what became of it.
  - name: capacity
    description: Quotas and the places work can run.
  - name: worker
    description: The worker's half of the lease protocol.

paths:
  /health/live:
    get:
      tags: [health]
      summary: Report that the process can serve HTTP
      description: >
        Depends on nothing else, so that an outage elsewhere does not cause this process to be restarted when restarting it would not help.
      security: []
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /health/ready:
    get:
      tags: [health]
      summary: Report that the platform can do its work
      description: >
        The record is reachable, the schema is the one this build expects, and stored
        bytes can be reached. A build whose migrations have not been applied is
        deliberately not ready.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  checks: { type: object, additionalProperties: true }
        '503':
          description: Not ready. The body says which check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  checks: { type: object, additionalProperties: true }
  /api/v1/platform:
    get:
      tags: [health]
      summary: Identify the build serving this request
      security: []
      responses:
        '200':
          description: The build.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  service: { type: string }
                  version: { type: string }
                  commit: { type: string }
                  builtAt: { type: string }
  /api/v1/sessions:
    post:
      tags: [sessions]
      summary: Sign in
      description: >
        An unknown address and a wrong secret are refused identically, so the
        response cannot be used to discover who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, secret]
              properties:
                email: { type: string, format: email }
                secret: { type: string, minLength: 12 }
      responses:
        '201':
          description: A session, in a cookie the browser cannot read from script and in the body for programmatic clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  principal:
                    $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [sessions]
      summary: Sign out
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/me:
    get:
      tags: [sessions]
      summary: Report who the caller is
      responses:
        '200':
          description: The caller and the institutions whose bindings apply to them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: '#/components/schemas/Principal'
                  organisations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/me/denials:
    get:
      tags: [sessions]
      summary: Report the refusals the caller has received
      description: >
        Why access was denied is data, not a log line.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Recent refusals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  denials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Denial'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/organisations:
    post:
      tags: [institutions]
      summary: Found an institution
      description: >
        It is created holding contributor at its own scope, so that its members can
        do its work without a separate grant each.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
      responses:
        '201':
          description: The institution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/people:
    post:
      tags: [institutions]
      summary: Add someone who can sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, email, secret]
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                secret: { type: string, minLength: 12 }
      responses:
        '201':
          description: The person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/grants:
    post:
      tags: [governance]
      summary: Bind a role at the platform, an institution, or the work queue
      description: >
        Grants on a city are made by that city's stewards instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectKind, subjectId, scopeKind, role]
              properties:
                subjectKind: { type: string, enum: [principal, org] }
                subjectId: { type: string }
                scopeKind: { type: string, enum: [platform, org, city, work] }
                scopeId: { type: string }
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}:
    get:
      tags: [institutions]
      summary: Read an institution and its members
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The institution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation:
                    $ref: '#/components/schemas/Organisation'
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Principal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/members:
    post:
      tags: [institutions]
      summary: Add a member
      description: >
        Membership makes the institution's bindings apply to that person; it grants nothing itself.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principalId]
              properties:
                principalId: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/members/{principalId}:
    delete:
      tags: [institutions]
      summary: Remove a member
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
        - name: principalId
          in: path
          required: true
          description: The person.
          schema: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/service-principals:
    post:
      tags: [institutions]
      summary: Add a worker, edge station, or vehicle
      description: >
        The credential is shown once and is not recoverable; it can only be replaced.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        '201':
          description: The principal and its credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: '#/components/schemas/Principal'
                  credential: { type: string }
                  notice: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organisations/{orgId}/quota:
    put:
      tags: [capacity]
      summary: State what an institution may consume
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxConcurrentJobs, maxCpu, maxMemoryBytes]
              properties:
                maxConcurrentJobs: { type: integer, minimum: 0 }
                maxCpu: { type: number, minimum: 0 }
                maxMemoryBytes: { type: integer, format: int64, minimum: 0 }
                maxGpu: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [capacity]
      summary: Report what an institution may consume and what it does
      description: >
        Reading this before submitting is how a refusal becomes understandable in advance.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      responses:
        '200':
          description: The quota and what is in flight.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    $ref: '#/components/schemas/Quota'
                  inUse: { type: object, additionalProperties: true }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/targets:
    post:
      tags: [capacity]
      summary: Record a place work can run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, capacityCpu, capacityMemoryBytes]
              properties:
                name: { type: string }
                kind: { type: string, enum: [local_docker, kubernetes, slurm] }
                capacityCpu: { type: number }
                capacityMemoryBytes: { type: integer, format: int64 }
                capacityGpu: { type: integer }
      responses:
        '201':
          description: The target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [capacity]
      summary: List the places work can run
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Target'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/vehicles:
    get:
      tags: [vehicles]
      summary: List the vehicles the caller may fly
      description: >
        A vehicle that is neither granted nor discoverable does not appear, and
        is not reported as withheld either: the platform does not distinguish a
        vehicle that does not exist from one that is not yours to know about.
      responses:
        '200':
          description: The vehicles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [vehicles]
      summary: Publish a vehicle
      description: >
        Vehicles are the platform's to publish and to grant. What a person
        brings is autonomy, not a hull.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                summary: { type: string }
                manufacturer: { type: string }
                discoverable: { type: boolean }
      responses:
        '201':
          description: The vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      summary: Read a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      responses:
        '200':
          description: The vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/vehicles/{vehicleId}/versions:
    get:
      tags: [vehicles]
      summary: A vehicle's packages, newest first
      description: >
        A package version is pinned by digest when a dive uses it, so that a
        result can be reproduced exactly.
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      responses:
        '200':
          description: The packages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/vehicles/{vehicleId}/grants:
    get:
      tags: [vehicles]
      summary: Who may fly a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      responses:
        '200':
          description: The grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Binding'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [vehicles]
      summary: Grant the use of a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectKind, subjectId, role]
              properties:
                subjectKind: { type: string, enum: [principal, org] }
                subjectId: { type: string }
                role: { type: string, enum: [viewer, contributor, steward, admin] }
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cities:
    get:
      tags: [places]
      summary: List the places the caller may learn of
      description: >
        An unlisted place appears only to those bound to it; it is otherwise
        indistinguishable from a place that does not exist.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [places]
      summary: Found a place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name, summary, extent, crsEpsg, verticalDatum, discoverability]
              properties:
                slug: { type: string }
                name: { type: string }
                summary: { type: string }
                extent:
                  $ref: '#/components/schemas/Extent'
                crsEpsg: { type: integer, minimum: 1 }
                verticalDatum: { type: string, minLength: 1 }
                discoverability:
                  $ref: '#/components/schemas/Discoverability'
      responses:
        '201':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cities/{cityId}:
    get:
      tags: [places]
      summary: Enter a place
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      responses:
        '200':
          description: The place and the caller's authority in it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    $ref: '#/components/schemas/City'
                  you: { type: object, additionalProperties: true }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [places]
      summary: Change a place's description or who may learn of it
      description: >
        Its extent, coordinate reference, and vertical datum are what the place is,
        and are not changed here.
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                summary: { type: string }
                discoverability:
                  $ref: '#/components/schemas/Discoverability'
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cities/{cityId}/grants:
    get:
      tags: [governance]
      summary: List who has been granted access to a place
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      responses:
        '200':
          description: The grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Binding'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [governance]
      summary: Share a place
      description: >
        Nothing is copied: a grant is an edge, and revoking it takes effect on the next request.
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectKind, subjectId, role]
              properties:
                subjectKind: { type: string, enum: [principal, org] }
                subjectId: { type: string }
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cities/{cityId}/grants/{bindingId}:
    delete:
      tags: [governance]
      summary: Withdraw access to a place
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
        - name: bindingId
          in: path
          required: true
          description: The grant.
          schema: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cities/{cityId}/layers:
    get:
      tags: [layers]
      summary: List the layers of a place
      description: >
        A layer holding nothing the caller may see does not appear.
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      responses:
        '200':
          description: The layers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Layer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [layers]
      summary: Contribute a layer to a place
      description: >
        It is contained by that scope and attributed to the institution named, which must be one the caller may act for.
      parameters:
        - name: cityId
          in: path
          required: true
          description: The place.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, kind, title, description, attributedOrgId]
              properties:
                slug: { type: string }
                kind: { type: string }
                title: { type: string }
                description: { type: string }
                attributedOrgId: { type: string }
      responses:
        '201':
          description: The layer.
          content:
            application/json:
