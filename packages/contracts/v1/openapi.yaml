          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                summary: { type: string }
                leaseSeconds:
                  type: integer
                  minimum: 60
                  default: 3600
                  description: >
                    How long a dive may hold a device before asking again. An
                    interactive session that loses its human should not hold a
                    GPU until somebody notices.
      responses:
        '201':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
