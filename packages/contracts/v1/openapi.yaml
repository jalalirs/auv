  /api/v1/versions/{versionId}/dynamics:
    put:
      tags: [vehicles]
      summary: State how a vehicle version moves
      description: >
        The difference between a vehicle that behaves like a submarine and one
        that is a box with gravity switched off. Refused once the version is
        published, by the record as well as by this.
      parameters:
        - name: versionId
          in: path
          required: true
          description: The package version.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleDynamics'
      responses:
        '204':
          description: Recorded.
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/versions/{versionId}/files:
    get:
      tags: [places]
      summary: A package's files, each with a short-lived URL to fetch it
      description: >
        What a node needs to sync a package. A cache keyed by digest is
        append-only — a digest never changes meaning — so syncing a new version
        means fetching the files whose digests are new, not the package again.
      parameters:
        - name: versionId
          in: path
          required: true
          description: The package version.
          schema: { type: string }
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        digest: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        mediaType: { type: string }
                        objectId: { type: string }
                        url:
                          type: string
                          description: >
                            Short-lived and signed over the host the caller will
                            use. Signing over the wrong one produces a URL that
                            verifies and cannot be reached.
                      required: [path, digest, sizeBytes, mediaType, objectId, url]
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/versions/{versionId}/publish:
    post:
      tags: [places]
      summary: Make a package pinnable, and from then on unchangeable
      description: >
        Only a published version may be pinned by a dive, because a draft can
        still be rewritten and a result pinned to something rewritable is not a
        result. A vehicle version that has not said how it moves is refused.
      parameters:
        - name: versionId
          in: path
          required: true
          description: The package version.
          schema: { type: string }
      responses:
        '200':
          description: The published package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
