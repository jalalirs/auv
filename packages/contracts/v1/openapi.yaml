    get:
      tags: [vehicles]
      summary: A vehicle's packages, newest first
      description: >
        A package version is pinned by digest when a dive uses it, so that a
        result can be reproduced exactly.
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      responses:
        '200':
          description: The packages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [vehicles]
      summary: Record a package for a vehicle
      description: >
        The digest is computed from the manifest rather than accepted, so nobody
        can claim an identity their files do not add up to. Publication is a
        separate act: a half-uploaded package that something could already pin
        would be worse than none at all.
      parameters:
        - name: vehicleId
          in: path
          required: true
          description: The vehicle.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                label: { type: string }
                notes: { type: string }
                runtimeMin:
                  type: string
                  description: >
                    The least runtime that may load this package. A vehicle
                    authored against a newer sensor API must not be flown by an
                    older simulator.
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [path, digest, sizeBytes, mediaType]
                    properties:
                      path: { type: string }
                      digest: { type: string }
                      sizeBytes: { type: integer, format: int64 }
                      mediaType: { type: string }
      responses:
        '201':
          description: The package, unpublished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
