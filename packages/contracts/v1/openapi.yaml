        asked once here rather than every time it runs with nobody present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '201':
          description: The recurring work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organisations/{orgId}/jobs:
    post:
      tags: [work]
      summary: Ask the platform to run work
      description: >
        The image is pinned by digest. Whether there is room is decided by the
        broker, which records either answer.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipeId, imageDigest, command, requestCpu, requestMemoryBytes, walltimeSeconds]
              properties:
                recipeId: { type: string }
                imageDigest: { type: string }
                command: { type: array, minItems: 1, items: { type: string } }
                args: { type: array, items: { type: string } }
                inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
                outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
                requestCpu: { type: number, exclusiveMinimum: 0 }
                requestMemoryBytes: { type: integer, format: int64, exclusiveMinimum: 0 }
                requestGpu: { type: integer, minimum: 0 }
                walltimeSeconds: { type: integer, exclusiveMinimum: 0 }
      responses:
        '202':
          description: The admitted work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Refused'
    get:
      tags: [work]
      summary: List an institution's work
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}:
    get:
      tags: [work]
      summary: Read one job, its attempts, and what it produced
      description: >
        The attempts are what show that a retry happened and what came of it.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
                  outputs: { type: object, additionalProperties: { type: string } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}/events:
    get:
      tags: [work]
      summary: Read a job's durable account of itself
      description: >
        Resuming from a sequence number is how a client watches without missing or repeating anything.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: The sequence number to resume from.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobEvent'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [work]
      summary: Stop work that has not finished
      description: >
        Running work learns of this through its worker's next heartbeat.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/lease:
    post:
      tags: [worker]
      summary: Take one admitted job
      description: >
        A worker holds authority over the work queue and over nothing else.
        Everything it reaches while running a job, it reaches through this lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetName]
              properties:
                targetName: { type: string }
      responses:
        '200':
          description: The lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/work/{attemptId}/heartbeat:
    post:
      tags: [worker]
      summary: Extend a lease and learn whether to stop
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The lease's new expiry, and whether the work was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heartbeat'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/{attemptId}/started:
    post:
      tags: [worker]
      summary: Report that the container is running
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
                placementRef: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/{attemptId}/progress:
    post:
      tags: [worker]
      summary: Report progress
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
                detail: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/{attemptId}/inputs:
    post:
      tags: [worker]
      summary: Read one input of leased work
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name]
              properties:
                token: { type: string }
                name: { type: string }
      responses:
        '200':
          description: The input and a short-lived URL to read it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  input:
                    $ref: '#/components/schemas/JobInput'
                  readUrl: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/{attemptId}/uploads:
    post:
      tags: [worker]
      summary: Obtain a grant to place one output in storage
      description: >
        The size the job declared bounds what may be uploaded, so oversized output is refused before any bytes move.
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name, sha256, sizeBytes]
              properties:
                token: { type: string }
                name: { type: string }
                sha256: { type: string }
                sizeBytes: { type: integer, format: int64 }
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/uploads/{grantId}/confirm:
    post:
      tags: [worker]
      summary: Check one output against what was declared
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
        - name: grantId
          in: path
          required: true
          description: The grant.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The recorded object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/outputs:
    post:
      tags: [worker]
      summary: Record one file the work produced
      description: >
        An output is recorded once per name however many attempts a job takes.
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name, objectId]
              properties:
                token: { type: string }
                name: { type: string }
                objectId: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/finish:
    post:
      tags: [worker]
      summary: Report how an attempt ended
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, outcome]
              properties:
                token: { type: string }
                outcome: { type: string, enum: [succeeded, failed, cancelled, evicted, timed_out] }
                exitCode: { type: integer }
                failureClass: { type: string }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: >
        A session token from POST /api/v1/sessions. Browsers receive the same
        token in a cookie they cannot read from script and need not set this
        header.
    service:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Service <principal id>:<secret>` — how a worker, edge station, or
        vehicle authenticates. A service principal holds exactly what it has been
        bound and no floor beneath that.

  responses:
    Unauthenticated:
      description: No credentials, or credentials that identify nobody.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >
        The object exists and the caller may not act on it. `detail.accessMayBeRequested`
        marks refusals where asking is the next step.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >
        Nothing the caller is entitled to know about. An unlisted place is
        reported this way whether or not it exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: The request describes something that cannot exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The record refuses this because of what it already holds.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: >
        Well-formed, but refused on its meaning: bytes that are not what was
        declared, or a truth class stronger than its lineage allows.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Refused:
      description: >
        Work the platform declined to admit. The code names the reason and the
        refusal is recorded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: A stable identifier for the kind of failure.
            message:
              type: string
              description: What went wrong, written for the person who will read it.
            requestId:
              type: string
              description: Ties this failure to every record written while serving the request.
            detail:
              type: object
              additionalProperties: true

    Extent:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      description: A bounded region of the globe, in WGS 84 degrees.
      properties:
        west: { type: number, minimum: -180, maximum: 180 }
        south: { type: number, minimum: -90, maximum: 90 }
        east: { type: number, minimum: -180, maximum: 180 }
        north: { type: number, minimum: -90, maximum: 90 }

    Role:
      type: string
      enum: [viewer, contributor, steward, admin]

    Uncertainty:
      type: object
      additionalProperties: false
      required: [kind]
      description: >
        What a version does not know. "unknown" is an answer; absence is not.
      properties:
        kind:
          type: string
          enum: [unknown, absolute_metres, relative_fraction, described]
        value:
          type: number
          minimum: 0
          description: Required for absolute_metres and relative_fraction; absent otherwise.
        note:
          type: string
          description: Required for described.

    Principal:
      type: object
      required: [id, kind, displayName, disabled, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [person, service] }
        displayName: { type: string }
        email: { type: string }
        orgId: { type: string }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    Organisation:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    ManifestFile:
      type: object
      required: [relativePath, objectId, sha256, sizeBytes, mediaType]
      properties:
        relativePath: { type: string }
        objectId: { type: string }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mediaType: { type: string }

    City:
      type: object
      description: >
        A place a dive happens in: a reef, a wreck, a test tank, a harbour. It
        exists at the platform and outlives the institutions granted access to
        it; ownership is a question answered in policy, never a property of the
        place.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        extent:
          $ref: '#/components/schemas/Extent'
        horizontalCrs: { type: string }
        verticalDatum:
          type: string
          description: >
            What z = 0 means here. A depth reported without one is a number
            rather than a measurement.
        discoverable:
          type: boolean
          description: >
            Discoverable places are listed to anyone signed in. The rest appear
            only to those granted them, and are otherwise indistinguishable
            from places that do not exist.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        retiredAt: { type: string, format: date-time, nullable: true }
      required: [id, slug, name, horizontalCrs, verticalDatum, discoverable, createdAt, createdBy]
    VehicleDynamics:
      type: object
      description: >
        What a simulator integrates. The matrices are carried as objects rather
        than named columns because their shape belongs to the runtime that reads
        them, and pinning it here would mean changing the contract every time
        the model gained a term.
      additionalProperties: false
      required: [massKg, displacedVolumeM3, centreOfGravityM, centreOfBuoyancyM,
                 inertiaTensor, addedMass, linearDamping, quadraticDamping,
                 thrusters, sensors, topicContract]
      properties:
        massKg: { type: number, exclusiveMinimum: 0 }
        displacedVolumeM3:
          type: number
          exclusiveMinimum: 0
          description: Buoyancy is computed from this, so a vehicle without it cannot float.
        centreOfGravityM:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        centreOfBuoyancyM:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
          description: >
            Distinct from the centre of gravity. The distance between them is
            the lever arm that rights the vehicle when it rolls; let them
            coincide and there is no restoring moment at all.
        inertiaTensor:
          type: array
          minItems: 9
          maxItems: 9
          items: { type: number }
        addedMass: { type: object }
        linearDamping: { type: object }
        quadraticDamping: { type: object }
        thrusters:
          type: array
          items: { type: object }
          description: Position, orientation, thrust curve and saturation per thruster.
        sensors:
          type: array
          items: { type: object }
        topicContract:
          type: object
          description: >
            What this vehicle publishes and subscribes to, so that a stack
            expecting a sonar on a vehicle carrying none is refused at admission
            rather than discovering it mid-dive.
    ClaimedRun:
      type: object
      description: >
        A dive an agent has taken, with everything needed to compose it: which
        packages to sync, what water, what autonomy, which device, and which DDS
        domain so that two dives on one host do not hear each other.
      properties:
        run:
          $ref: '#/components/schemas/Run'
        cityVersionId: { type: string }
        vehicleVersionId: { type: string }
        conditions:
          $ref: '#/components/schemas/Conditions'
        initialState: { type: object }
        objective: { type: object }
        autonomyImage: { type: string }
        autonomyDigest: { type: string }
        autonomyWantsGpu: { type: boolean }
        autonomySubscribes: { type: array, items: { type: string } }
        autonomyPublishes: { type: array, items: { type: string } }
        deviceIndex: { type: integer }
        deviceUuid: { type: string }
        rosDomainId:
          type: integer
          description: >
            Derived from the device rather than drawn, so a run that is retried
            lands on the same domain as the device it holds.
      required: [run, cityVersionId, vehicleVersionId, conditions, deviceIndex, deviceUuid, rosDomainId]
    Queue:
      type: object
      description: >
        A pool of devices that access is granted to. The governed resource is
        the queue, not the device, which is what lets one workstation and a rack
        be described the same way and makes adding hardware an insert.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        leaseSeconds: { type: integer }
        draining:
          type: boolean
          description: >
            A draining queue accepts nothing new and lets what it holds finish,
            which is how a host is taken out of service without killing a dive.
        devices: { type: integer, description: How many devices it holds. }
        free: { type: integer, description: How many no run is holding. }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, slug, name, leaseSeconds, draining, devices, free, createdAt, createdBy]
    Device:
      type: object
      description: >
        One GPU, in one queue, on a host that runs an agent. Claimed whole:
        hardware that cannot partition would not keep a fractional promise.
      properties:
        id: { type: string }
        queueId: { type: string }
        targetId: { type: string }
        deviceIndex: { type: integer }
        uuid:
          type: string
          description: Survives a reboot reordering the indices, which is why it identifies the device.
        model: { type: string }
        memoryBytes: { type: integer, format: int64 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, queueId, targetId, deviceIndex, uuid, memoryBytes, enabled, createdAt]
    AutonomyStack:
      type: object
      description: >
        Somebody's own code, as a container image. The platform supplies the
        vehicle and the water; this is what a person brings.
      properties:
        id: { type: string }
        orgId: { type: string }
        slug: { type: string }
        name: { type: string }
        imageRepository: { type: string }
        imageDigest: { type: string }
        subscribes: { type: array, items: { type: string } }
        publishes: { type: array, items: { type: string } }
        wantsGpu: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, orgId, slug, name, imageRepository, imageDigest, createdAt, createdBy]
    Conditions:
      type: object
      description: >
        The water a dive happens in — either the ocean as it was at an instant,
        or a situation somebody constructed.
      properties:
        id: { type: string }
        kind: { type: string, enum: [observed, constructed] }
        name: { type: string }
        observedAt: { type: string, format: date-time, nullable: true }
        sources: { type: array, items: { type: object } }
        parameters: { type: object }
        orgId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, kind, name, createdAt, createdBy]
    Dive:
      type: object
      description: >
        A definition, not an execution: a vehicle in a place, under conditions,
        flown by autonomy.
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        summary: { type: string }
        cityVersionId: { type: string }
        vehicleVersionId: { type: string }
        conditionsId: { type: string }
        autonomyStackId: { type: string, nullable: true }
        initialState: { type: object }
        objective: { type: object }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, orgId, name, cityVersionId, vehicleVersionId, conditionsId, createdAt, createdBy]
    Run:
      type: object
      description: >
        One execution of a dive, and everything needed to have it again. The
        digests, the seed and the runtime version are copied at admission, so
        that editing the dive afterwards cannot change what this result means.
      properties:
        id: { type: string }
        diveId: { type: string }
        queueId: { type: string }
        mode: { type: string, enum: [interactive, batch] }
        state:
          type: string
          enum: [queued, preparing, running, succeeded, failed, cancelled, expired]
        cityDigest: { type: string }
        vehicleDigest: { type: string }
        conditionsDigest: { type: string }
        autonomyDigest: { type: string, nullable: true }
        seed:
          type: integer
          format: int64
          description: >
            The same seed and the same digests means the same run. Replay costs
            nothing, a regression is real rather than noise, and a failure can
            be reopened and watched.
        runtimeVersion: { type: string }
        deviceId: { type: string, nullable: true }
        gpuShare: { type: number }
        requestedAt: { type: string, format: date-time }
        requestedBy: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        leaseExpiresAt: { type: string, format: date-time, nullable: true }
        outcome: { type: object }
        failureReason: { type: string, nullable: true }
      required: [id, diveId, queueId, mode, state, cityDigest, vehicleDigest,
                 conditionsDigest, seed, runtimeVersion, gpuShare, requestedAt, requestedBy]
    Vehicle:
      type: object
      description: >
        Something a dive is flown in. Published and granted by the platform;
        what a person brings is autonomy, not a hull.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        manufacturer: { type: string }
        discoverable: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        retiredAt: { type: string, format: date-time, nullable: true }
      required: [id, slug, name, discoverable, createdAt, createdBy]
    AssetVersion:
      type: object
      description: >
        One publication of a city or a vehicle. The digest is over the manifest
        and the manifest is over the bytes, so pinning the digest pins every
        byte — which is what lets a dive be reproduced and a node treat its
        cache as append-only.
      properties:
        id: { type: string }
        assetKind: { type: string, enum: [city, vehicle] }
        assetId: { type: string }
        ordinal:
          type: integer
          minimum: 1
          description: >
            The nth publication of this asset. Ordinal, not semantic: nothing
            about the number promises compatibility.
        label: { type: string }
        notes: { type: string }
        digest: { type: string }
        totalBytes: { type: integer, format: int64 }
        runtimeMin:
          type: string
          description: >
            The least runtime that may load this package. A vehicle authored
            against a newer sensor API must not be flown by an older simulator.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Absent while the package is a draft. Only a published version may
            be pinned, because a draft can still be rewritten and a result
            pinned to something rewritable is not a result.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, assetKind, assetId, ordinal, digest, totalBytes, createdAt, createdBy]
    Binding:
      type: object
      required: [id, subjectKind, subjectId, scopeKind, role, createdAt, createdBy]
      properties:
        id: { type: string }
        subjectKind: { type: string, enum: [principal, org] }
        subjectId: { type: string }
        scopeKind: { type: string, enum: [platform, org, city, work] }
        scopeId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        revokedAt: { type: string, format: date-time }

    Object:
      type: object
      required: [id, bucket, sha256, sizeBytes, mediaType, uploadedBy, uploadedAt]
      properties:
        id: { type: string }
        bucket: { type: string, enum: [evidence, derived, ephemeral] }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mediaType: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }

    UploadGrant:
      type: object
      required: [id, bucket, uploadUrl, expiresAt]
      properties:
        id: { type: string }
        bucket: { type: string, enum: [evidence, derived, ephemeral] }
        uploadUrl:
          type: string
          description: >
            A short-lived URL accepting exactly one upload. It is signed over its
            host, so it names the address this caller can reach.
        expiresAt: { type: string, format: date-time }

    JobInput:
      type: object
      required: [name, relativePath, objectId, sha256, mediaType, sizeBytes]
      properties:
        name: { type: string }
        relativePath: { type: string }
        objectId: { type: string }
        sha256: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }

    JobOutput:
      type: object
      required: [name, relativePath, mediaType, maxSizeBytes]
      properties:
        name: { type: string }
        relativePath: { type: string }
        mediaType: { type: string }
        maxSizeBytes: { type: integer, format: int64 }

    Job:
      type: object
      required: [id, orgId, submittedBy, recipeId, imageDigest, command,
                 requestCpu, requestMemoryBytes, walltimeSeconds, state,
                 failureClass, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        submittedBy: { type: string }
        recipeId: { type: string }
        imageDigest:
          type: string
          description: >
            A content address naming exactly one image: either a registry
            digest, `repository@sha256:…`, or `sha256:…`, the identity of an
            image already on the host. A tag can be moved and proves nothing.
        command: { type: array, items: { type: string } }
        args: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
        outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
        requestCpu: { type: number }
        requestMemoryBytes: { type: integer, format: int64 }
        requestGpu: { type: integer }
        walltimeSeconds: { type: integer }
        targetId: { type: string }
        egress: { $ref: '#/components/schemas/Egress' }
        state:
          type: string
          enum: [pending, admitted, running, succeeded, failed, cancelled, evicted, timed_out]
        failureClass:
          type: string
          enum: [none, image_unavailable, input_unavailable, output_limit_exceeded,
                 nonzero_exit, walltime_exceeded, worker_lost, cancelled_by_caller,
                 internal_error]
        createdAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }

    Attempt:
      type: object
      required: [id, jobId, ordinal, targetId, workerId, state, leaseExpiresAt, failureClass, leasedAt]
      description: One placement of a job onto a target. Retries create attempts, never new jobs.
      properties:
        id: { type: string }
        jobId: { type: string }
        ordinal: { type: integer }
        targetId: { type: string }
        workerId: { type: string }
        state:
          type: string
          enum: [leased, running, succeeded, failed, cancelled, evicted, timed_out]
        leaseExpiresAt: { type: string, format: date-time }
        placementRef: { type: string }
        exitCode: { type: integer }
        failureClass: { type: string }
        leasedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    JobEvent:
      type: object
      required: [id, jobId, sequence, occurredAt, kind, detail]
      description: One entry in a job's durable, ordered account of itself.
      properties:
        id: { type: string }
        jobId: { type: string }
        attemptId: { type: string }
        sequence: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        kind:
          type: string
          enum: [admitted, scheduled, started, progress, output_received,
                 succeeded, failed, cancelled, evicted, timed_out]
        detail: { type: object, additionalProperties: true }

    Target:
      type: object
      required: [id, name, kind, enabled, capacityCpu, capacityMemoryBytes, capacityGpu, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [local_docker, kubernetes, slurm] }
        enabled: { type: boolean }
        capacityCpu: { type: number }
        capacityMemoryBytes: { type: integer, format: int64 }
        capacityGpu: { type: integer }
        createdAt: { type: string, format: date-time }

    Quota:
      type: object
      required: [orgId, maxConcurrentJobs, maxCpu, maxMemoryBytes, maxGpu, updatedAt]
      properties:
        orgId: { type: string }
        maxConcurrentJobs: { type: integer }
        maxCpu: { type: number }
        maxMemoryBytes: { type: integer, format: int64 }
        maxGpu: { type: integer }
        updatedAt: { type: string, format: date-time }

    Denial:
      type: object
      required: [id, occurredAt, action, resourceKind, effect, reason, requestId]
      description: A recorded refusal, so that "why can I not see this" is answerable from data.
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        principalId: { type: string }
        action: { type: string }
        resourceKind: { type: string }
        resourceId: { type: string }
        effect: { type: string, enum: [hidden, visible] }
        reason: { type: string }
        requestId: { type: string }

    Egress:
      type: string
      description: >
        Whether a job's container may reach the network. `none` is what every
        institution's work gets. `internet` is a capability granted only to work
        an administrator of the platform submits, and it is all or nothing:
        narrowing it to named hosts would need a proxy that does not exist, and
        recording an allowlist nothing enforces would read as a control.
      enum: [none, internet]
      default: none

    Schedule:
      type: object
      required: [id, name, orgId, intervalSeconds, enabled, nextRunAt, createdAt,
                 recipeId, imageDigest, egress]
      properties:
        id: { type: string }
        name: { type: string }
        orgId: { type: string }
        recipeId: { type: string }
        imageDigest: { type: string }
        intervalSeconds: { type: integer, minimum: 60 }
        enabled: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        lastJobId: { type: string }
        createdAt: { type: string, format: date-time }
        egress: { $ref: '#/components/schemas/Egress' }

    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, intervalSeconds, orgId, recipeId, imageDigest, command,
                 requestCpu, requestMemoryBytes, walltimeSeconds]
      properties:
        name: { type: string, minLength: 1 }
        intervalSeconds:
          type: integer
          minimum: 60
          description: Recurring work repeats no more often than once a minute.
        firstRunAt: { type: string, format: date-time }
        orgId: { type: string }
        recipeId: { type: string }
        imageDigest: { type: string }
        command: { type: array, minItems: 1, items: { type: string } }
        args: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
        outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
        requestCpu: { type: number, exclusiveMinimum: 0 }
        requestMemoryBytes: { type: integer, format: int64, exclusiveMinimum: 0 }
        requestGpu: { type: integer, minimum: 0 }
        walltimeSeconds: { type: integer, exclusiveMinimum: 0 }
        egress: { $ref: '#/components/schemas/Egress' }

    Lease:
      type: object
      required: [attemptId, token, expiresAt, job]
      properties:
        attemptId: { type: string }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        job: { $ref: '#/components/schemas/Job' }

    Heartbeat:
      type: object
      required: [expiresAt, cancelled]
      properties:
        expiresAt: { type: string, format: date-time }
        cancelled:
          type: boolean
          description: Tells the worker to stop. This is how cancellation reaches running work.
