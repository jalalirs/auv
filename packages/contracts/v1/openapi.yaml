                $ref: '#/components/schemas/Layer'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/world/layers:
    get:
      tags: [layers]
      summary: List the layers of the shared world
      description: >
        A layer holding nothing the caller may see does not appear.
      responses:
        '200':
          description: The layers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Layer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [layers]
      summary: Contribute a layer to the shared world
      description: >
        It is contained by that scope and attributed to the institution named, which must be one the caller may act for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, kind, title, description, attributedOrgId]
              properties:
                slug: { type: string }
                kind: { type: string }
                title: { type: string }
                description: { type: string }
                attributedOrgId: { type: string }
      responses:
        '201':
          description: The layer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/layers/{layerId}:
    get:
      tags: [layers]
      summary: Read a layer and the versions the caller may see
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
      responses:
        '200':
          description: The layer and its versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layer:
                    $ref: '#/components/schemas/Layer'
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Version'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/layers/{layerId}/versions:
    post:
      tags: [evidence]
      summary: Record evidence
      description: >
        Everything a version must state is required: a coordinate reference, a
        vertical datum, a time basis, rights, attribution, and an uncertainty — of
        which "unknown" is a legal answer and absence is not. A version derived from a
        scenario cannot claim a stronger truth class.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '201':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/layers/{layerId}/versions/{versionId}:
    get:
      tags: [evidence]
      summary: Read one version
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: '#/components/schemas/Version'
                  uncertainty:
                    $ref: '#/components/schemas/Uncertainty'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/layers/{layerId}/versions/{versionId}/lineage:
    get:
      tags: [evidence]
      summary: Report what a version was derived from
      description: >
        This is what makes a claim traceable to the material behind it.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      responses:
        '200':
          description: The inputs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  derivedFrom:
                    type: array
                    items:
                      $ref: '#/components/schemas/Version'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/layers/{layerId}/versions/{versionId}/files/{path}:
    get:
      tags: [evidence]
      summary: Read one file of a version
      description: >
        Access to bytes follows access to the evidence that contains them, so a
        caller who may not see the version cannot reach its bytes by knowing an
        object identifier.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
        - name: path
          in: path
          required: true
          description: The file's path within the version.
          schema: { type: string }
      responses:
        '200':
          description: The file and a short-lived URL to read it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: '#/components/schemas/ManifestFile'
                  readUrl: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/layers/{layerId}/versions/{versionId}/submit:
    post:
      tags: [evidence]
      summary: Offer a draft for review
      description: >
        Only a draft can be offered.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/layers/{layerId}/versions/{versionId}/publish:
    post:
      tags: [evidence]
      summary: Publish a reviewed version
      description: >
        Publishing a version that supersedes another marks the earlier one superseded in the same transaction.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/layers/{layerId}/versions/{versionId}/promote:
    post:
      tags: [evidence]
      summary: Make a contribution part of the shared record
      description: >
        Nothing moves: the object keys, the content digest, and the version number are unchanged. Only who may see it changes.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/layers/{layerId}/versions/{versionId}/retract:
    post:
      tags: [evidence]
      summary: Withdraw a published version from default views
      description: >
        It is not deleted, and neither is its lineage: retraction is a statement about a version, not its erasure.
      parameters:
        - name: layerId
          in: path
          required: true
          description: The layer.
          schema: { type: string }
        - name: versionId
          in: path
          required: true
          description: The version.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organisations/{orgId}/uploads:
    post:
      tags: [bytes]
      summary: Obtain a grant to place bytes in storage
      description: >
        What the caller claims about those bytes is written down now, so that it can be checked against what actually arrives.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bucket, sha256, sizeBytes, mediaType]
              properties:
                bucket: { type: string, enum: [evidence, derived, ephemeral] }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                sizeBytes: { type: integer, format: int64, minimum: 1 }
                mediaType: { type: string }
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGrant'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organisations/{orgId}/uploads/{grantId}/confirm:
    post:
      tags: [bytes]
      summary: Check what arrived against what was declared
      description: >
        Bytes that are not what they said they were are discarded and nothing is recorded.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
        - name: grantId
          in: path
          required: true
          description: The grant.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The recorded object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/schedules:
    get:
      tags: [work]
      summary: List the platform's recurring work and when each next runs
      description: >
        The daily loop. Recurring work belongs to the platform rather than to
        any institution, because no institution owns it.
      responses:
        '200':
          description: The recurring work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [work]
      summary: Record recurring work
      description: >
        Creates recurring work, or updates it if the name is known. Egress and
        publication need the same authority they would need on a single job,
        asked once here rather than every time it runs with nobody present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '201':
          description: The recurring work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organisations/{orgId}/jobs:
    post:
      tags: [work]
      summary: Ask the platform to run work
      description: >
        The image is pinned by digest. Whether there is room is decided by the
        broker, which records either answer.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipeId, imageDigest, command, requestCpu, requestMemoryBytes, walltimeSeconds]
              properties:
                recipeId: { type: string }
                imageDigest: { type: string }
                command: { type: array, minItems: 1, items: { type: string } }
                args: { type: array, items: { type: string } }
                inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
                outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
                requestCpu: { type: number, exclusiveMinimum: 0 }
                requestMemoryBytes: { type: integer, format: int64, exclusiveMinimum: 0 }
                requestGpu: { type: integer, minimum: 0 }
                walltimeSeconds: { type: integer, exclusiveMinimum: 0 }
      responses:
        '202':
          description: The admitted work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Refused'
    get:
      tags: [work]
      summary: List an institution's work
      parameters:
        - name: orgId
          in: path
          required: true
          description: The institution.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}:
    get:
      tags: [work]
      summary: Read one job, its attempts, and what it produced
      description: >
        The attempts are what show that a retry happened and what came of it.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
                  outputs: { type: object, additionalProperties: { type: string } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}/events:
    get:
      tags: [work]
      summary: Read a job's durable account of itself
      description: >
        Resuming from a sequence number is how a client watches without missing or repeating anything.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: The sequence number to resume from.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobEvent'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [work]
      summary: Stop work that has not finished
      description: >
        Running work learns of this through its worker's next heartbeat.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/work/lease:
    post:
      tags: [worker]
      summary: Take one admitted job
      description: >
        A worker holds authority over the work queue and over nothing else.
        Everything it reaches while running a job, it reaches through this lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetName]
              properties:
                targetName: { type: string }
      responses:
        '200':
          description: The lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/work/{attemptId}/heartbeat:
    post:
      tags: [worker]
