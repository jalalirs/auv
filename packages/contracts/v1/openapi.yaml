            schema:
              type: object
              additionalProperties: false
              required: [token, name, sha256, sizeBytes]
              properties:
                token: { type: string }
                name: { type: string }
                sha256: { type: string }
                sizeBytes: { type: integer, format: int64 }
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/uploads/{grantId}/confirm:
    post:
      tags: [worker]
      summary: Check one output against what was declared
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
        - name: grantId
          in: path
          required: true
          description: The grant.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The recorded object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/outputs:
    post:
      tags: [worker]
      summary: Record one file the work produced
      description: >
        An output is recorded once per name however many attempts a job takes.
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name, objectId]
              properties:
                token: { type: string }
                name: { type: string }
                objectId: { type: string }
      responses:
        '204':
          description: Done.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/work/{attemptId}/finish:
    post:
      tags: [worker]
      summary: Report how an attempt ended
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The attempt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, outcome]
              properties:
                token: { type: string }
                outcome: { type: string, enum: [succeeded, failed, cancelled, evicted, timed_out] }
                exitCode: { type: integer }
                failureClass: { type: string }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: >
        A session token from POST /api/v1/sessions. Browsers receive the same
        token in a cookie they cannot read from script and need not set this
        header.
    service:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Service <principal id>:<secret>` — how a worker, edge station, or
        vehicle authenticates. A service principal holds exactly what it has been
        bound and no floor beneath that.

  responses:
    Unauthenticated:
      description: No credentials, or credentials that identify nobody.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >
        The object exists and the caller may not act on it. `detail.accessMayBeRequested`
        marks refusals where asking is the next step.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >
        Nothing the caller is entitled to know about. An unlisted place is
        reported this way whether or not it exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: The request describes something that cannot exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The record refuses this because of what it already holds.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: >
        Well-formed, but refused on its meaning: bytes that are not what was
        declared, or a truth class stronger than its lineage allows.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Refused:
      description: >
        Work the platform declined to admit. The code names the reason and the
        refusal is recorded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: A stable identifier for the kind of failure.
            message:
              type: string
              description: What went wrong, written for the person who will read it.
            requestId:
              type: string
              description: Ties this failure to every record written while serving the request.
            detail:
              type: object
              additionalProperties: true

    Extent:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      description: A bounded region of the globe, in WGS 84 degrees.
      properties:
        west: { type: number, minimum: -180, maximum: 180 }
        south: { type: number, minimum: -90, maximum: 90 }
        east: { type: number, minimum: -180, maximum: 180 }
        north: { type: number, minimum: -90, maximum: 90 }

    TruthClass:
      type: string
      description: >
        What a value is, epistemically. It travels down lineage and is never
        strengthened: anything derived from a scenario is a scenario.
      enum: [observation, analysis, forecast, scenario, simulation]

    Discoverability:
      type: string
      description: >
        What a principal with no binding may learn about a place. Separate from
        whether that principal may enter it.
      enum: [listed_open, listed_locked, unlisted]

    Role:
      type: string
      enum: [viewer, contributor, steward, admin]

    Uncertainty:
      type: object
      additionalProperties: false
      required: [kind]
      description: >
        What a version does not know. "unknown" is an answer; absence is not.
      properties:
        kind:
          type: string
          enum: [unknown, absolute_metres, relative_fraction, described]
        value:
          type: number
          minimum: 0
          description: Required for absolute_metres and relative_fraction; absent otherwise.
        note:
          type: string
          description: Required for described.

    Principal:
      type: object
      required: [id, kind, displayName, disabled, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [person, service] }
        displayName: { type: string }
        email: { type: string }
        orgId: { type: string }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    Organisation:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    City:
      type: object
      required: [id, slug, name, summary, extent, crsEpsg, verticalDatum, discoverability, createdAt, createdBy]
      description: >
        A bounded, curated, navigable place. It exists at the platform and is
        addressed permanently; an organisation is granted access to it and never
        contains it.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        extent: { $ref: '#/components/schemas/Extent' }
        crsEpsg: { type: integer }
        verticalDatum: { type: string }
        discoverability: { $ref: '#/components/schemas/Discoverability' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    Layer:
      type: object
      required: [id, scopeKind, slug, kind, title, description, attributedOrgId, createdBy, createdAt]
      description: >
        A named series of versions within one scope. Contained by the platform
        or by a city; attributed to the organisation that contributed it.
      properties:
        id: { type: string }
        scopeKind: { type: string, enum: [platform, city] }
        cityId: { type: string }
        slug: { type: string }
        kind:
          type: string
          enum: [bathymetry, mesh, point_cloud, orthomosaic, structure, field,
                 observation_series, annotation, telemetry, tileset, imagery]
        title: { type: string }
        description: { type: string }
        attributedOrgId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    ManifestFile:
      type: object
      required: [relativePath, objectId, sha256, sizeBytes, mediaType]
      properties:
        relativePath: { type: string }
        objectId: { type: string }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mediaType: { type: string }

    Version:
      type: object
      required: [id, layerId, ordinal, contentDigest, truthClass, crsEpsg,
                 verticalDatum, extent, observedFrom, observedTo, rights,
                 attribution, state, visibility, createdAt]
      description: >
        Immutable evidence: what was measured or computed, where, when, by what,
        and how well it is known.
      properties:
        id: { type: string }
        layerId: { type: string }
        ordinal: { type: integer }
        contentDigest:
          type: string
          description: The digest over this version's whole manifest, and its citable identity.
        truthClass: { $ref: '#/components/schemas/TruthClass' }
        crsEpsg: { type: integer }
        verticalDatum: { type: string }
        extent: { $ref: '#/components/schemas/Extent' }
        observedFrom: { type: string, format: date-time }
        observedTo: { type: string, format: date-time }
        clockOffsetSeconds:
          type: number
          description: The instrument clock's offset from UTC, where it was determined.
        rights: { type: string }
        attribution: { type: string }
        state: { type: string, enum: [draft, in_review, published, superseded, retracted] }
        visibility: { type: string, enum: [restricted, canonical] }
        supersedesId: { type: string }
        supersededById: { type: string }
        producerJobId: { type: string }
        producerPrincipalId: { type: string }
        recipeId: { type: string }
        imageDigest: { type: string }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        retractedAt: { type: string, format: date-time }
        retractionReason: { type: string }
        manifest:
          type: array
          items: { $ref: '#/components/schemas/ManifestFile' }

    VersionRequest:
      type: object
      additionalProperties: false
      required: [truthClass, crsEpsg, verticalDatum, extent, observedFrom,
                 observedTo, uncertainty, rights, attribution, files]
      properties:
        truthClass: { $ref: '#/components/schemas/TruthClass' }
        crsEpsg: { type: integer, minimum: 1 }
        verticalDatum: { type: string, minLength: 1 }
        extent: { $ref: '#/components/schemas/Extent' }
        observedFrom: { type: string, format: date-time }
        observedTo: { type: string, format: date-time }
        clockOffsetSeconds: { type: number }
        uncertainty: { $ref: '#/components/schemas/Uncertainty' }
        rights: { type: string, minLength: 1 }
        attribution: { type: string, minLength: 1 }
        visibility: { type: string, enum: [restricted, canonical] }
        files:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [relativePath, objectId]
            properties:
              relativePath: { type: string }
              objectId: { type: string }
        derivedFrom:
          type: array
          items: { type: string }
          description: The versions this one was computed from. Their truth classes bound what it may claim.
        supersedesId: { type: string }

    Vehicle:
      type: object
      description: >
        Something a dive is flown in. Published and granted by the platform;
        what a person brings is autonomy, not a hull.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        manufacturer: { type: string }
        discoverable: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        retiredAt: { type: string, format: date-time, nullable: true }
      required: [id, slug, name, discoverable, createdAt, createdBy]
    AssetVersion:
      type: object
      description: >
        One publication of a city or a vehicle. The digest is over the manifest
        and the manifest is over the bytes, so pinning the digest pins every
        byte — which is what lets a dive be reproduced and a node treat its
        cache as append-only.
      properties:
        id: { type: string }
        assetKind: { type: string, enum: [city, vehicle] }
        assetId: { type: string }
        ordinal:
          type: integer
          minimum: 1
          description: >
            The nth publication of this asset. Ordinal, not semantic: nothing
            about the number promises compatibility.
        label: { type: string }
        notes: { type: string }
        digest: { type: string }
        totalBytes: { type: integer, format: int64 }
        runtimeMin:
          type: string
          description: >
            The least runtime that may load this package. A vehicle authored
            against a newer sensor API must not be flown by an older simulator.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Absent while the package is a draft. Only a published version may
            be pinned, because a draft can still be rewritten and a result
            pinned to something rewritable is not a result.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
      required: [id, assetKind, assetId, ordinal, digest, totalBytes, createdAt, createdBy]
    Binding:
      type: object
      required: [id, subjectKind, subjectId, scopeKind, role, createdAt, createdBy]
      properties:
        id: { type: string }
        subjectKind: { type: string, enum: [principal, org] }
        subjectId: { type: string }
        scopeKind: { type: string, enum: [platform, org, city, work] }
        scopeId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        revokedAt: { type: string, format: date-time }

    Object:
      type: object
      required: [id, bucket, sha256, sizeBytes, mediaType, uploadedBy, uploadedAt]
      properties:
        id: { type: string }
        bucket: { type: string, enum: [evidence, derived, ephemeral] }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mediaType: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }

    UploadGrant:
      type: object
      required: [id, bucket, uploadUrl, expiresAt]
      properties:
        id: { type: string }
        bucket: { type: string, enum: [evidence, derived, ephemeral] }
        uploadUrl:
          type: string
          description: >
            A short-lived URL accepting exactly one upload. It is signed over its
            host, so it names the address this caller can reach.
        expiresAt: { type: string, format: date-time }

    JobInput:
      type: object
      required: [name, relativePath, objectId, sha256, mediaType, sizeBytes]
      properties:
        name: { type: string }
        relativePath: { type: string }
        objectId: { type: string }
        sha256: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }

    JobOutput:
      type: object
      required: [name, relativePath, mediaType, maxSizeBytes]
      properties:
        name: { type: string }
        relativePath: { type: string }
        mediaType: { type: string }
        maxSizeBytes: { type: integer, format: int64 }

    Job:
      type: object
      required: [id, orgId, submittedBy, recipeId, imageDigest, command,
                 requestCpu, requestMemoryBytes, walltimeSeconds, state,
                 failureClass, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        submittedBy: { type: string }
        recipeId: { type: string }
        imageDigest:
          type: string
          description: >
            A content address naming exactly one image: either a registry
            digest, `repository@sha256:…`, or `sha256:…`, the identity of an
            image already on the host. A tag can be moved and proves nothing.
        command: { type: array, items: { type: string } }
        args: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
        outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
        requestCpu: { type: number }
        requestMemoryBytes: { type: integer, format: int64 }
        requestGpu: { type: integer }
        walltimeSeconds: { type: integer }
        targetId: { type: string }
        egress: { $ref: '#/components/schemas/Egress' }
        state:
          type: string
          enum: [pending, admitted, running, succeeded, failed, cancelled, evicted, timed_out]
        failureClass:
          type: string
          enum: [none, image_unavailable, input_unavailable, output_limit_exceeded,
                 nonzero_exit, walltime_exceeded, worker_lost, cancelled_by_caller,
                 internal_error]
        createdAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }

    Attempt:
      type: object
      required: [id, jobId, ordinal, targetId, workerId, state, leaseExpiresAt, failureClass, leasedAt]
      description: One placement of a job onto a target. Retries create attempts, never new jobs.
      properties:
        id: { type: string }
        jobId: { type: string }
        ordinal: { type: integer }
        targetId: { type: string }
        workerId: { type: string }
        state:
          type: string
          enum: [leased, running, succeeded, failed, cancelled, evicted, timed_out]
        leaseExpiresAt: { type: string, format: date-time }
        placementRef: { type: string }
        exitCode: { type: integer }
        failureClass: { type: string }
        leasedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    JobEvent:
      type: object
      required: [id, jobId, sequence, occurredAt, kind, detail]
      description: One entry in a job's durable, ordered account of itself.
      properties:
        id: { type: string }
        jobId: { type: string }
        attemptId: { type: string }
        sequence: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        kind:
          type: string
          enum: [admitted, scheduled, started, progress, output_received,
                 succeeded, failed, cancelled, evicted, timed_out]
        detail: { type: object, additionalProperties: true }

    Target:
      type: object
      required: [id, name, kind, enabled, capacityCpu, capacityMemoryBytes, capacityGpu, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [local_docker, kubernetes, slurm] }
        enabled: { type: boolean }
        capacityCpu: { type: number }
        capacityMemoryBytes: { type: integer, format: int64 }
        capacityGpu: { type: integer }
        createdAt: { type: string, format: date-time }

    Quota:
      type: object
      required: [orgId, maxConcurrentJobs, maxCpu, maxMemoryBytes, maxGpu, updatedAt]
      properties:
        orgId: { type: string }
        maxConcurrentJobs: { type: integer }
        maxCpu: { type: number }
        maxMemoryBytes: { type: integer, format: int64 }
        maxGpu: { type: integer }
        updatedAt: { type: string, format: date-time }

    Denial:
      type: object
      required: [id, occurredAt, action, resourceKind, effect, reason, requestId]
      description: A recorded refusal, so that "why can I not see this" is answerable from data.
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        principalId: { type: string }
        action: { type: string }
        resourceKind: { type: string }
        resourceId: { type: string }
        effect: { type: string, enum: [hidden, visible] }
        reason: { type: string }
        requestId: { type: string }

    Egress:
      type: string
      description: >
        Whether a job's container may reach the network. `none` is what every
        institution's work gets. `internet` is a capability granted only to work
        an administrator of the platform submits, and it is all or nothing:
        narrowing it to named hosts would need a proxy that does not exist, and
        recording an allowlist nothing enforces would read as a control.
      enum: [none, internet]
      default: none

    PublicationRequest:
      type: object
      additionalProperties: false
      required: [layerId, descriptorOutput]
      description: >
        What a job's result becomes. Declared when the job is submitted and
        fixed thereafter, so a job cannot decide to publish something it was not
        asked to publish. The job writes a VersionDescriptor as its
        `descriptorOutput`; every other declared output becomes the version's
        payload, at the path the job declared for it.
      properties:
        layerId:
          type: string
          description: The layer the result belongs to.
        descriptorOutput:
          type: string
          description: The declared output whose content is a VersionDescriptor.
        publish:
          type: boolean
          description: Move the version out of draft when the job succeeds.
        promote:
          type: boolean
          description: >
            Make it part of the shared record, which needs steward authority in
            the scope at the moment the job is submitted.
        supersedePrevious:
          type: boolean
          description: >
            Mark the layer's current published version superseded, which is what
            makes a recurring ingestion a chain rather than a pile.

    VersionDescriptor:
      type: object
      additionalProperties: false
      required: [truthClass, crsEpsg, verticalDatum, extent, observedFrom,
                 observedTo, uncertainty, rights, attribution]
      description: >
        What a job writes to say what it produced. It states everything a
        version must state, and is validated exactly as a version a person
        records is validated: a job gets no easier path. It is written as a
        file; a job holds no credential and reaches no route.
      properties:
        truthClass: { $ref: '#/components/schemas/TruthClass' }
        crsEpsg: { type: integer, minimum: 1 }
        verticalDatum: { type: string, minLength: 1 }
        extent: { $ref: '#/components/schemas/Extent' }
        observedFrom: { type: string, format: date-time }
        observedTo: { type: string, format: date-time }
        clockOffsetSeconds: { type: number }
        uncertainty: { $ref: '#/components/schemas/Uncertainty' }
        rights: { type: string, minLength: 1 }
        attribution: { type: string, minLength: 1 }

    Schedule:
      type: object
      required: [id, name, orgId, intervalSeconds, enabled, nextRunAt, createdAt,
                 recipeId, imageDigest, egress]
      properties:
        id: { type: string }
        name: { type: string }
        orgId: { type: string }
        recipeId: { type: string }
        imageDigest: { type: string }
        intervalSeconds: { type: integer, minimum: 60 }
        enabled: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        lastJobId: { type: string }
        createdAt: { type: string, format: date-time }
        egress: { $ref: '#/components/schemas/Egress' }
        publish: { $ref: '#/components/schemas/PublicationRequest' }

    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, intervalSeconds, orgId, recipeId, imageDigest, command,
                 requestCpu, requestMemoryBytes, walltimeSeconds]
      properties:
        name: { type: string, minLength: 1 }
        intervalSeconds:
          type: integer
          minimum: 60
          description: Recurring work repeats no more often than once a minute.
        firstRunAt: { type: string, format: date-time }
        orgId: { type: string }
        recipeId: { type: string }
        imageDigest: { type: string }
        command: { type: array, minItems: 1, items: { type: string } }
        args: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/JobInput' } }
        outputs: { type: array, items: { $ref: '#/components/schemas/JobOutput' } }
        requestCpu: { type: number, exclusiveMinimum: 0 }
        requestMemoryBytes: { type: integer, format: int64, exclusiveMinimum: 0 }
        requestGpu: { type: integer, minimum: 0 }
        walltimeSeconds: { type: integer, exclusiveMinimum: 0 }
        egress: { $ref: '#/components/schemas/Egress' }
        publish: { $ref: '#/components/schemas/PublicationRequest' }

    Lease:
      type: object
      required: [attemptId, token, expiresAt, job]
      properties:
        attemptId: { type: string }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        job: { $ref: '#/components/schemas/Job' }

    Heartbeat:
      type: object
      required: [expiresAt, cancelled]
      properties:
        expiresAt: { type: string, format: date-time }
        cancelled:
          type: boolean
          description: Tells the worker to stop. This is how cancellation reaches running work.
