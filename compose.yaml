name: auv

x-auv-common: &auv-common
  build:
    context: .
    dockerfile: docker/Dockerfile
    network: host
    args:
      USER_UID: ${AUV_USER_UID:-1000}
      USER_GID: ${AUV_USER_GID:-1000}
  image: auv-dev:dave-jazzy-harmonic
  init: true
  network_mode: host
  runtime: nvidia
  user: "${AUV_USER_UID:-1000}:${AUV_USER_GID:-1000}"
  environment: &auv-environment
    HOME: /home/ubuntu
    NVIDIA_VISIBLE_DEVICES: ${AUV_GPU_DEVICE:-0}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    ROS_LOG_DIR: /data/logs/ros
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    DISPLAY: ""
  volumes:
    - .:/workspace/auv
    - ${AUV_DATA_DIR:-/home/jalalirs/code/auv-data}:/data
  working_dir: /workspace/auv
  shm_size: 1gb
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${AUV_GPU_DEVICE:-0}"]
            capabilities: [gpu]

services:
  auv-dev:
    <<: *auv-common
    container_name: auv-dev
    stdin_open: true
    tty: true
    command: sleep infinity

  first-dive:
    <<: *auv-common
    container_name: auv-first-dive
    environment:
      <<: *auv-environment
      RCUTILS_COLORIZED_OUTPUT: "1"
    command:
      - bash
      - -lc
      - |
        set -e
        mkdir -p /data/logs/ros /data/runtime/ardusub
        cd /workspace/auv/ros2_ws
        colcon build --symlink-install --packages-up-to auv_bringup
        source install/setup.bash
        cd /data/runtime/ardusub
        exec ros2 launch auv_bringup first_dive.launch.py

  reef:
    build:
      context: .
      dockerfile: docker/stonefish/Dockerfile
      network: host
      args:
        USER_UID: ${AUV_USER_UID:-1000}
        USER_GID: ${AUV_USER_GID:-1000}
    image: auv-reef:stonefish-1.6
    container_name: auv-living-reef
    init: true
    network_mode: host
    runtime: nvidia
    user: "${AUV_USER_UID:-1000}:${AUV_USER_GID:-1000}"
    environment:
      HOME: /home/ubuntu
      NVIDIA_VISIBLE_DEVICES: ${AUV_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display,video
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      XDG_RUNTIME_DIR: /data/runtime/reef/xdg
    volumes:
      - .:/workspace/auv
      - ${AUV_DATA_DIR:-/home/jalalirs/code/auv-data}:/data
    working_dir: /workspace/auv
    shm_size: 2gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUV_GPU_DEVICE:-0}"]
              capabilities: [gpu]
