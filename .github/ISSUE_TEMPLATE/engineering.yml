name: Engineering task
description: Build a bounded, verifiable capability
title: "[Engineering]: "
labels:
  - "type:engineering"
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the user-visible or scientifically useful result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List commands, measurements, renders, or tests that demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility and provenance
      description: Identify versions, data manifests, coordinate frames, timestamps, and required records.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Platform
        - Reef data
        - Ocean data
        - Simulation
        - Robotics
        - Operations
    validations:
      required: true
