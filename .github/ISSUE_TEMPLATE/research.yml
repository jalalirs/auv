name: Research task
description: Investigate a scientific, data, standards, or architecture question
title: "[Research]: "
labels:
  - "type:research"
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State one answerable question and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to examine
      description: Primary sources, datasets, experiments, or experts to consult.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Describe the decision, note, benchmark, or artifact this work must produce.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Data, licensing, and provenance risks
      description: Record access restrictions, licenses, coordinate/time metadata, or uncertainty concerns.
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Platform
        - Reef data
        - Ocean data
        - Simulation
        - Robotics
        - Operations
        - Research
    validations:
      required: true
