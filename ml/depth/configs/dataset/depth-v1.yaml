# depth-v1: the first training set for the depth model.
#
# Dense labels from NOAA topobathy lidar over coral reefs (the public
# noaa-nos-coastal-lidar-pds bucket), one survey per area; sparse labels from
# ICESat-2 over the Red Sea places. Input: Sentinel-2 L2A band medians.
# Built 2026-10-07: 3,267 chips, 35.0 M labelled cells. The data is not in
# git (the repository is public): it lives under the data root, and
# manifest.json there says what was built from this file.

name: depth-v1
chip:
  cells: 128            # per side
  cell_m: 10.0          # Sentinel-2's own resolution
  labelled_at_least: 0.25   # share of a chip that must be measured seabed
  shallowest_m: -0.5
  deepest_m: -30.0
sentinel2:
  collection: sentinel-2-c1-l2a
  bands: [coastal, blue, green, red, rededge1, nir, swir16]
  scenes: 8             # the median of up to this many clear scenes
  cloud_below: 20.0     # per cent, over the scene
  covers_at_least: 0.95 # of the chip, for a scene to count
  masked_scl: [3, 8, 9, 10]   # cloud shadow, cloud, thin cirrus
red_sea:
  label: icesat2
  places: [shushah, al-fahal]
  # Areas along the Saudi coast where ICESat-2 finds the reefs: every pass over
  # each, a chip wherever its seafloor photons cross at least
  # least_photon_cells cells. A test of the model on Red Sea water, which no
  # lidar here covers. bbox: west, south, east, north.
  least_photon_cells: 100
  regions:
    - {name: thuwal, bbox: [38.80, 21.90, 39.20, 22.60]}     # the reefs off KAUST
    - {name: neom, bbox: [34.55, 27.60, 35.30, 28.20]}       # Shushah, Tiran, the mouth of Aqaba
    - {name: al-wajh, bbox: [36.20, 25.70, 36.90, 26.50]}    # the Al Wajh bank
    - {name: yanbu, bbox: [37.80, 23.80, 38.30, 24.25]}
    - {name: farasan, bbox: [41.60, 16.40, 42.30, 17.20]}    # the Farasan islands
left_out: >-
  French Frigate Shoals (12 GB), the post-Irma Keys survey (13.6 GB), Puerto Rico's 2015, 2016 and 2018 flights.
# Each survey's heights are in its own vertical datum, from its metadata. Sea-level datums
# (NAVD88, LMSL, the territories' own) are decimetres apart and used as they are; a survey
# in ellipsoid heights is excluded until a geoid model converts it.
lidar:
  - slug: NGS_Tutuila_AS_Topobathy_2022_10093
    name: "Tutuila, American Samoa"
    year: "2022"
    region: Am. Samoa
    gb: 1.018
    files: 29
    vertical_datum: "ellipsoid"
    excluded: "heights above the ellipsoid, not sea level (the survey's metadata), about 17 m off at Samoa; unet-v1 was 17 m out there for it. Needs a geoid model to use."
  - slug: NGS_Ofu_Olosega_AS_Topobathy_2022_10084
