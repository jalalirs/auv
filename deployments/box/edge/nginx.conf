# The part of Coral City that faces the internet.
#
# Mounted at https://jalalirs.tailedf721.ts.net/coral through Tailscale Funnel,
# beside the other things served from that name. Funnel strips the /coral, so
# what arrives here is /api/..., /mcp, /health/...
#
# Only what a customer's program needs: the platform's API and the MCP server.
# Not the administration console — granting access and reading refusals belong
# to whoever runs the platform, and that does not need to be reachable from
# anywhere on Earth. Everything not named below is refused.

# Who is asking, from what Funnel says. Every request arrives from tailscaled on
# this box, so without this every throttle below would be one bucket shared by
# the whole internet.
set_real_ip_from 127.0.0.1;
set_real_ip_from 100.64.0.0/10;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Signing in costs a full argon2id hash on purpose, so a guess is expensive to
# the guesser — and, unthrottled, expensive to us: every attempt from anywhere
# is a fraction of a second of this box's CPU. Five a minute per address is
# plenty for a person who mistyped and nothing for a list of passwords.
limit_req_zone $binary_remote_addr zone=signing_in:10m rate=5r/m;
# And everything else, generously: an agent in a loop is the ordinary case.
limit_req_zone $binary_remote_addr zone=everything:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    location = /api/v1/sessions {
        limit_req zone=signing_in burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/proxied.conf;
    }

    location /api/ {
        limit_req zone=everything burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/proxied.conf;
    }

    location = /mcp {
        limit_req zone=everything burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://mcp:8080/mcp;
        # A tool that flies a dive can take its time answering.
        proxy_read_timeout 600s;
        include /etc/nginx/proxied.conf;
    }

    location = /health {
        proxy_pass http://mcp:8080/health;
    }

    location / {
        return 404 '{"error":{"code":"not_found","message":"Coral City here is its API under /api and its MCP server at /mcp"}}';
        default_type application/json;
    }
}
