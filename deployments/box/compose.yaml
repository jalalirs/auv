name: iocean

# The box is the environment.
#
# There is one machine, so there is one deployment, and it is written as though
# there will be more: nothing here knows it is the only host. The agent reaches
# the control plane over the network rather than the loopback, images come from
# a registry rather than a local build cache, and stored bytes are addressed
# through an S3 endpoint rather than a path. A second GPU host — in a rack, in
# a cloud, behind a scheduler — joins by running the agent and being granted a
# queue, and nothing below changes.
#
# What deliberately is not here: Kubernetes. This box already runs k3s for
# another project and dives are not scheduled by it. A dive holds a whole GPU,
# a lease, and two cooperating containers; that is an agent's job, and an agent
# runs equally well on bare metal, on a cloud instance, or behind Slurm — which
# is the portability that matters, and the portability a manifest would not buy.

x-platform-env: &platform-env
  IOCEAN_DATABASE_URL: postgres://coral:${IOCEAN_DATABASE_PASSWORD:?set a database password}@record:5432/coral?sslmode=disable
  IOCEAN_STORAGE_ENDPOINT: storage:9000
  # A presigned URL is signed over the host it names, so it must carry the
  # address the client will actually use. Inside this network that is
  # `storage`; to anything outside it is whatever the operator publishes.
  # By default the same address the API is published on, so that the client on
  # a laptop across the network can fetch a package's picture with the URL the
  # platform hands it. Before this it was the loopback, and every picture and
  # site record a client asked for was signed over a host only the box could
  # reach.
  IOCEAN_STORAGE_PUBLIC_ENDPOINT: ${IOCEAN_STORAGE_PUBLIC_ENDPOINT:-${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_STORAGE_PORT:-19000}}
  IOCEAN_STORAGE_ACCESS_KEY: ${IOCEAN_STORAGE_ACCESS_KEY:?set a storage access key}
  IOCEAN_STORAGE_SECRET_KEY: ${IOCEAN_STORAGE_SECRET_KEY:?set a storage secret key}
  IOCEAN_STORAGE_BUCKET_PREFIX: coral
  # A model this platform may ask to draft a plan from words, and the key to
  # ask with. Both empty unless the operator sets them, which is not an error:
  # drafting then says plainly that there is nothing to ask. They are named
  # here rather than passed wholesale, because a service should receive the
  # secrets it needs and not every secret the machine holds.
  IOCEAN_MODEL_URL: ${IOCEAN_MODEL_URL:-}
  IOCEAN_MODEL_KEY: ${IOCEAN_MODEL_KEY:-}
  IOCEAN_MODEL: ${IOCEAN_MODEL:-}

services:
  record:
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    environment:
      POSTGRES_USER: coral
      POSTGRES_PASSWORD: ${IOCEAN_DATABASE_PASSWORD:?set a database password}
      POSTGRES_DB: coral
    volumes:
      - record:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coral -d coral"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "4", memory: 8G }
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IOCEAN_STORAGE_ACCESS_KEY:?set a storage access key}
      MINIO_ROOT_PASSWORD: ${IOCEAN_STORAGE_SECRET_KEY:?set a storage secret key}
    volumes:
      # An operator-chosen path, because cities, vehicles and recorded dives
      # grow without bound and this host's root filesystem is shared with other
      # people's work. Docker cannot bound a named volume, so the bound is
      # whichever filesystem this path sits on: point it somewhere with room,
      # and somewhere whose exhaustion is this platform's problem alone.
      - ${IOCEAN_STORAGE_PATH:?set a path for stored bytes, on a filesystem with room}:/data
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_STORAGE_PORT:-19000}:9000"
      - "127.0.0.1:${IOCEAN_STORAGE_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "4", memory: 8G }
    restart: unless-stopped

  # Vehicles are published as images and autonomy arrives as one, so there has
  # to be somewhere to put them that is not a developer's laptop. Docker treats
  # a registry on localhost as insecure-by-default, which is why this is
  # published on loopback and reached from elsewhere through the tailnet rather
  # than opened to the network with a certificate it does not have yet.
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry:/var/lib/registry
    ports:
      - "127.0.0.1:${IOCEAN_REGISTRY_PORT:-18081}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    restart: unless-stopped

  # Applying the schema is a deliberate act, never something a serving process
  # does on the way up.
  migrate:
    image: iocean/control-plane:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment: *platform-env
    depends_on:
      record:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  # The part that faces the internet: the API and the MCP server, behind
  # Tailscale Funnel at https://jalalirs.tailedf721.ts.net/iocean. Sign-in is
  # throttled per address and nothing else — not the console — is reachable.
  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/proxied.conf:/etc/nginx/proxied.conf:ro
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_EDGE_PORT:-18084}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: unless-stopped

  # The platform's tools for agents, over MCP, on the tailnet.
  #
  # Point an assistant at http://<box>:18083/mcp with its own credential in the
  # Authorization header. The server holds none: it forwards what each caller
  # sends, so every agent acts as the principal it was issued as and the
  # platform's grants decide what it may do.
  mcp:
    image: iocean/mcp:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    build:
      context: ../..
      dockerfile: packages/mcp/Dockerfile
    environment:
      IOCEAN_PLATFORM: http://control-plane:8080
      IOCEAN_RUNTIME_VERSION: ${IOCEAN_RUNTIME_VERSION:-isaac-6.0.1+oceansim}
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_MCP_PORT:-18083}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # A credential for an agent: a program that reads this institution on
  # somebody's behalf, so an assistant can be pointed at the platform without
  # being handed a person's sign-in secret.
  #
  # Viewer at the institution and nothing else. Run it deliberately —
  # `docker compose run --rm agent` — rather than on every `up`, because a
  # credential that appears without anybody asking is a credential nobody is
  # keeping track of. Idempotent: a file that already holds one is left alone,
  # since re-running must not orphan an agent already using it.
  agent-credential:
    image: iocean/control-plane:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - agent
      - -organisation=${IOCEAN_ADMIN_ORG:?set the institution}
      - -name=${IOCEAN_AGENT_NAME:-mcp}
      - -credential-file=/credentials/mcp
    environment: *platform-env
    volumes:
      - credentials:/credentials
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Establishing the first administrator cannot go through the API, because
  # until it happens there is nobody to authorise it. Idempotent: an
  # installation that already has one is left alone. It also issues the agent's
  # credential, which cannot be recovered once created and is therefore written
  # to a volume the agent reads.
  bootstrap:
    image: iocean/control-plane:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - bootstrap
      - -email=${IOCEAN_ADMIN_EMAIL:?set the first administrator's email}
      - -secret=${IOCEAN_ADMIN_SECRET:?set the first administrator's secret}
      - -name=${IOCEAN_ADMIN_NAME:?set the first administrator's name}
      - -organisation=${IOCEAN_ADMIN_ORG:?set the first institution}
      - -organisation-name=${IOCEAN_ADMIN_ORG_NAME:-iocean}
      - -target=${IOCEAN_AGENT_TARGET:-box}
      - -worker-credential-file=/credentials/worker
    environment: *platform-env
    volumes:
      - credentials:/credentials
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  control-plane:
    image: iocean/control-plane:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    # Built here rather than streamed from a developer's machine: this host has
    # a checkout, a builder, and the right architecture, and cross-building an
    # amd64 image on an Apple-silicon laptop to ship it over SSH is slower and
    # less faithful than building it where it runs.
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
      args:
        VERSION: ${IOCEAN_VERSION:-development}
        COMMIT: ${IOCEAN_COMMIT:-unknown}
        BUILT_AT: ${IOCEAN_BUILT_AT:-unknown}
    environment:
      <<: *platform-env
      IOCEAN_HTTP_ADDRESS: :8080
      # Sessions travel over the tailnet rather than TLS on this host, so the
      # secure attribute would make the cookie unusable rather than safer. It
      # goes back on the moment there is a certificate.
      IOCEAN_SECURE_COOKIES: ${IOCEAN_SECURE_COOKIES:-false}
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_API_PORT:-18080}:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    restart: unless-stopped

  # The agent claims work, and to run a dive it will need to start containers
  # that hold a GPU. It does not hold one itself: it drives the host's runtime,
  # so what it needs is the socket and a staging directory the runtime can also
  # see, because a bind mount is resolved by the daemon on the host and not
  # inside this container.
  agent:
    image: iocean/worker:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      IOCEAN_CONTROL_PLANE_URL: http://control-plane:8080
      IOCEAN_WORKER_CREDENTIAL_FILE: /credentials/worker
      IOCEAN_WORKER_TARGET: ${IOCEAN_AGENT_TARGET:-box}
      IOCEAN_WORKER_WORKDIR: /work
      IOCEAN_WORKER_HOST_WORKDIR: ${IOCEAN_AGENT_HOST_WORKDIR:-/var/lib/iocean/work}
      # What a dive is simulated in. A property of this host rather than of the
      # platform: what it has, and what its GPUs can run.
      IOCEAN_SIM_IMAGE: ${IOCEAN_SIM_IMAGE:-127.0.0.1:18081/sim-runtime:r1}
      # What this host reports it can simulate in, every time it asks for work.
      # Whoever asks for a dive names a runtime, and cannot know what is
      # installed on a machine in a rack — so the machine says.
      IOCEAN_RUNTIME_VERSION: ${IOCEAN_RUNTIME_VERSION:-isaac-6.0.1+oceansim}
      # Where somebody watching an interactive dive connects. The address of
      # this machine as the people who use it reach it — which this host knows
      # and the control plane does not.
      IOCEAN_STREAM_HOST: ${IOCEAN_STREAM_HOST:-127.0.0.1}
      # A model a dive may be flown by, passed on to the dives that ask to be.
      # Only those: a dive that does not name a controller which needs one gets
      # no network and no key, which is what every dive an institution submits
      # is and should stay.
      IOCEAN_MODEL_URL: ${IOCEAN_MODEL_URL:-}
      IOCEAN_MODEL_KEY: ${IOCEAN_MODEL_KEY:-}
      IOCEAN_MODEL: ${IOCEAN_MODEL:-}
      IOCEAN_MODEL_MAX_TOKENS: ${IOCEAN_MODEL_MAX_TOKENS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IOCEAN_AGENT_HOST_WORKDIR:-/var/lib/iocean/work}:/work
      - credentials:/credentials:ro
    user: "0:0"
    depends_on:
      control-plane:
        condition: service_healthy
    # The agent is small; the containers it starts carry the limits the
    # platform admitted them for.
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
    restart: unless-stopped

  # The control plane's operator console: resources and governance. Not the
  # application people dive in — that is a different thing, and letting an
  # administration screen pretend to be a product is how the first attempt at
  # this went wrong.
  console:
    image: iocean/console:${IOCEAN_IMAGE_TAG:-r1}
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_CONSOLE_PORT:-18082}:8080"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped

volumes:
  record:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city_record
  registry:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city_registry
  credentials:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city_credentials
