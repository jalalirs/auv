name: iocean-gpu

# The GPU host is a shared workstation, not a cluster. It runs other people's
# work alongside this, so every container here declares a limit: a
# reconstruction job must not be able to take the machine down, and neither must
# the platform that admitted it.
#
# Images are built on a developer's machine and streamed here, because this host
# cannot reliably reach a package registry. Nothing below pulls.

x-platform-env: &platform-env
  IOCEAN_DATABASE_URL: postgres://coral:${IOCEAN_DATABASE_PASSWORD:?set a database password}@record:5432/coral?sslmode=disable
  IOCEAN_STORAGE_ENDPOINT: storage:9000
  # A presigned URL is signed over its host, so it must name the address the
  # client will use. Reaching this deployment means forwarding both ports;
  # `tools/gpu web` does that.
  IOCEAN_STORAGE_PUBLIC_ENDPOINT: ${IOCEAN_STORAGE_PUBLIC_ENDPOINT:-localhost:19000}
  IOCEAN_STORAGE_ACCESS_KEY: ${IOCEAN_STORAGE_ACCESS_KEY:?set a storage access key}
  IOCEAN_STORAGE_SECRET_KEY: ${IOCEAN_STORAGE_SECRET_KEY:?set a storage secret key}
  IOCEAN_STORAGE_BUCKET_PREFIX: coral

services:
  record:
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    environment:
      POSTGRES_USER: coral
      POSTGRES_PASSWORD: ${IOCEAN_DATABASE_PASSWORD:?set a database password}
      POSTGRES_DB: coral
    volumes:
      - record:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coral -d coral"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "4", memory: 4G }
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IOCEAN_STORAGE_ACCESS_KEY:?set a storage access key}
      MINIO_ROOT_PASSWORD: ${IOCEAN_STORAGE_SECRET_KEY:?set a storage secret key}
    volumes:
      # A path the operator chooses, because the host's root filesystem is
      # shared and close to full and growth here must not become somebody
      # else's outage. Docker cannot bound a named volume, so the bound is
      # whichever filesystem this path is on: point it at one with room, and at
      # one whose exhaustion is this platform's problem alone.
      - ${IOCEAN_STORAGE_PATH:?set a path for stored bytes, on a filesystem with room}:/data
    ports:
      - "127.0.0.1:${IOCEAN_STORAGE_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "4", memory: 4G }
    restart: unless-stopped

  migrate:
    image: iocean/control-plane:r1
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment: *platform-env
    depends_on:
      record:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  bootstrap:
    image: iocean/control-plane:r1
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - bootstrap
      - -email=${IOCEAN_ADMIN_EMAIL:?set the first administrator's email}
      - -secret=${IOCEAN_ADMIN_SECRET:?set the first administrator's secret}
      - -name=${IOCEAN_ADMIN_NAME:?set the first administrator's name}
      - -organisation=${IOCEAN_ADMIN_ORG:?set the first institution}
      - -organisation-name=${IOCEAN_ADMIN_ORG_NAME:-iocean}
      - -target=local-docker
      - -worker-credential-file=/credentials/worker
    environment: *platform-env
    volumes:
      - credentials:/credentials
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  control-plane:
    image: iocean/control-plane:r1
    pull_policy: never
    environment:
      <<: *platform-env
      IOCEAN_HTTP_ADDRESS: :8080
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    restart: unless-stopped

  worker:
    image: iocean/worker:r1
    pull_policy: never
    environment:
      IOCEAN_CONTROL_PLANE_URL: http://control-plane:8080
      IOCEAN_WORKER_CREDENTIAL_FILE: /credentials/worker
      IOCEAN_WORKER_TARGET: ${IOCEAN_WORKER_TARGET:-local-docker}
      IOCEAN_WORKER_WORKDIR: /work
      IOCEAN_WORKER_HOST_WORKDIR: ${IOCEAN_WORKER_HOST_WORKDIR:-/var/lib/iocean/work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IOCEAN_WORKER_HOST_WORKDIR:-/var/lib/iocean/work}:/work
      - credentials:/credentials:ro
    user: "0:0"
    depends_on:
      control-plane:
        condition: service_healthy
    # The worker itself is small; the containers it starts carry the limits the
    # platform admitted them for.
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
    restart: unless-stopped

  web:
    image: iocean/web:r1
    pull_policy: never
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${IOCEAN_BIND_ADDRESS:-127.0.0.1}:${IOCEAN_WEB_PORT:-18088}:8080"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped

volumes:
  record:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city-gpu_record
  credentials:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city-gpu_credentials
