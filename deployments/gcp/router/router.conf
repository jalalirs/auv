# https://iocean.areen.ai, served from the box. A copy of Areen's router
# (api.areen.ai): Cloud Run takes the public name and its certificate, and this
# nginx passes every request to the box's Tailscale Funnel, where iOcean is
# mounted at /iocean. No VPC, no tailnet membership.
resolver 8.8.8.8 1.1.1.1 valid=60s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    # Dives stream events and the installer is over 100 MB: no buffering and
    # long timeouts.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;
    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    location = /_router/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cloud Run refuses a response over 32 MB, so the installers are fetched
    # from the box's own address. Their manifest still comes through here.
    location ~ ^/downloads/.+\.(dmg|exe|deb)$ {
        return 302 https://jalalirs.tailedf721.ts.net/iocean$request_uri;
    }

    # WITHDRAWN 2026-11-01: 0.1.1 and 0.1.2 were built with a developer's
    # sign-in inside. Nothing is offered until clean builds replace them; the
    # site reads the missing manifest as "coming soon".
    location ^~ /downloads/ {
        return 404;
    }

    location / {
        set $box jalalirs.tailedf721.ts.net;
        rewrite ^(.*)$ /iocean$1 break;
        proxy_pass https://$box;
        proxy_set_header Host $box;
        proxy_ssl_name $box;
        # A redirect the box makes to its own address comes back as ours.
        proxy_redirect https://jalalirs.tailedf721.ts.net/iocean/ /;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
