name: iocean-local

# The development stack is the production shape at development size: the same
# control plane, the same worker, the same record, and the same object store.
# Nothing here is a stand-in for a component that would be different in
# production, because a stand-in would hide exactly the problems worth finding.

x-platform-env: &platform-env
  IOCEAN_DATABASE_URL: postgres://coral:coral@record:5432/coral?sslmode=disable
  IOCEAN_STORAGE_ENDPOINT: storage:9000
  # A presigned URL is signed over its host, so it must name the address the
  # client will actually use — which for a browser or a developer's machine is
  # not the address inside the container network.
  IOCEAN_STORAGE_PUBLIC_ENDPOINT: ${IOCEAN_STORAGE_PUBLIC_ENDPOINT:-localhost:19000}
  IOCEAN_STORAGE_ACCESS_KEY: ${IOCEAN_STORAGE_ACCESS_KEY:-coral-development}
  IOCEAN_STORAGE_SECRET_KEY: ${IOCEAN_STORAGE_SECRET_KEY:-coral-development-secret}
  IOCEAN_STORAGE_BUCKET_PREFIX: coral

services:
  record:
    # A multi-architecture PostGIS build, so the same image runs on an
    # Apple-silicon workstation and on an x86 host.
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    environment:
      POSTGRES_USER: coral
      POSTGRES_PASSWORD: coral
      POSTGRES_DB: coral
    volumes:
      - record:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coral -d coral"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IOCEAN_STORAGE_ACCESS_KEY:-coral-development}
      MINIO_ROOT_PASSWORD: ${IOCEAN_STORAGE_SECRET_KEY:-coral-development-secret}
    volumes:
      - storage:/data
    ports:
      - "127.0.0.1:${IOCEAN_STORAGE_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applying the schema is a deliberate act, never something a serving process
  # does on startup. The control plane waits for this to finish.
  migrate:
    image: iocean/control-plane:r1
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment: *platform-env
    depends_on:
      record:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  # Establishing the first administrator is the one act that cannot be done
  # through the API, because until it happens there is nobody to authorise it.
  # It is idempotent: an installation that already has an administrator is left
  # alone. It also provisions the worker, whose credential cannot be recovered
  # once issued and is therefore written to a file the worker reads.
  #
  # The credentials below are development defaults. The GPU and production
  # deployments require them to be supplied.
  bootstrap:
    image: iocean/control-plane:r1
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - bootstrap
      - -email=${IOCEAN_ADMIN_EMAIL:-admin@coral.local}
      - -secret=${IOCEAN_ADMIN_SECRET:-development-secret}
      - -name=${IOCEAN_ADMIN_NAME:-Development Administrator}
      - -organisation=${IOCEAN_ADMIN_ORG:-coral}
      - -organisation-name=${IOCEAN_ADMIN_ORG_NAME:-iocean}
      - -target=local-docker
      - -worker-credential-file=/credentials/worker
    environment: *platform-env
    volumes:
      - credentials:/credentials
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  control-plane:
    image: iocean/control-plane:r1
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
      args:
        VERSION: ${IOCEAN_VERSION:-development}
        COMMIT: ${IOCEAN_COMMIT:-unknown}
        BUILT_AT: ${IOCEAN_BUILT_AT:-unknown}
    environment:
      <<: *platform-env
      IOCEAN_HTTP_ADDRESS: :8080
    # Published on loopback so that development tooling and the end-to-end
    # check can reach the API directly. The web container reaches it over the
    # compose network and does not need this.
    ports:
      - "127.0.0.1:${IOCEAN_API_PORT:-18089}:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: iocean/worker:r1
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      IOCEAN_CONTROL_PLANE_URL: http://control-plane:8080
      IOCEAN_WORKER_CREDENTIAL_FILE: /credentials/worker
      IOCEAN_WORKER_TARGET: ${IOCEAN_WORKER_TARGET:-local-docker}
      IOCEAN_WORKER_WORKDIR: /work
      # A bind mount is resolved by the container runtime on the host, so the
      # worker must know the host path of the directory it stages into.
      IOCEAN_WORKER_HOST_WORKDIR: ${IOCEAN_WORKER_HOST_WORKDIR:-/tmp/iocean-work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IOCEAN_WORKER_HOST_WORKDIR:-/tmp/iocean-work}:/work
      - credentials:/credentials:ro
    # The worker drives the host's container runtime, so it runs as the user
    # that may use that socket.
    user: "0:0"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  record:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city-local_record
  storage:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city-local_storage
  credentials:
    # Named as it was before the rename, so the data in it is kept.
    name: coral-city-local_credentials
